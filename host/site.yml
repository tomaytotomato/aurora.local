---
# Host-level bootstrap for a home.local server. Hardware-agnostic:
# runs on anything Debian-family (Optiplex, NUC, tower, VM).
#
#   ansible-playbook -i ../inventory.ini host/site.yml -K
#
# The packages/* compose stacks assume this playbook has already run.

- name: Bootstrap home.local host
  hosts: home_servers
  become: true
  roles:
    - common
    - docker
    - firewall
    - ssh-hardening
    - fail2ban
