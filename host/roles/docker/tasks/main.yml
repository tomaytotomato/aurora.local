---
- name: Ensure keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch_map[ansible_facts['architecture']] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: false

- name: Update apt cache (allow warnings from unrelated repos)
  ansible.builtin.apt:
    update_cache: true
  register: apt_update
  failed_when: apt_update.failed and 'docker.com' in (apt_update.msg | default(''))

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Add home_user to docker group
  ansible.builtin.user:
    name: "{{ home_user }}"
    groups: docker
    append: true

- name: Enable & start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure home_local_root exists
  ansible.builtin.file:
    path: "{{ home_local_root }}"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: "0755"
