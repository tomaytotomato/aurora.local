---
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Deploy smartd.conf
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smartd

- name: Enable and start smartd
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started

# ---- disk-state collector for the dashboard's /disks page ----
# Independent of the smartd daemon above: that only watches for alerts,
# it never dumps structured SMART data anywhere for another process to
# read. jq is needed to build the JSON state file.
- name: Install jq (for the disk-state collector)
  ansible.builtin.apt:
    name: jq
    state: present
  when: smartd_disk_state_enabled

- name: Ensure the dashboard state directory exists
  ansible.builtin.file:
    path: "{{ smartd_disk_state_path | dirname }}"
    state: directory
    owner: "{{ home_user | default('bruce') }}"
    group: "{{ home_user | default('bruce') }}"
    mode: "0755"
  when: smartd_disk_state_enabled

- name: Deploy the disk-state collector script
  ansible.builtin.template:
    src: aurora-disk-state.sh.j2
    dest: /usr/local/bin/aurora-disk-state
    owner: root
    group: root
    mode: "0755"
  when: smartd_disk_state_enabled

- name: Deploy the disk-state collector service unit
  ansible.builtin.template:
    src: aurora-disk-state.service.j2
    dest: /etc/systemd/system/aurora-disk-state.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: smartd_disk_state_enabled

- name: Deploy the disk-state collector timer unit
  ansible.builtin.template:
    src: aurora-disk-state.timer.j2
    dest: /etc/systemd/system/aurora-disk-state.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: smartd_disk_state_enabled

- name: Flush handlers so the timer unit is known before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start the disk-state collector timer
  ansible.builtin.systemd:
    name: aurora-disk-state.timer
    enabled: true
    state: started
  when: smartd_disk_state_enabled

- name: Disable the disk-state collector timer
  ansible.builtin.systemd:
    name: aurora-disk-state.timer
    enabled: false
    state: stopped
  when: not smartd_disk_state_enabled
  failed_when: false
