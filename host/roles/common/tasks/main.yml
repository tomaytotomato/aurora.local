---
- name: Set timezone
  community.general.timezone:
    name: "{{ home_timezone }}"

- name: Ensure baseline packages present
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - vim
      - htop
      - tmux
      - rsync
      - unzip
      - lm-sensors
      - avahi-daemon
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Ensure home user exists in docker group later (placeholder for docker role)
  ansible.builtin.user:
    name: "{{ home_user }}"
    uid: "{{ home_uid }}"
    shell: /bin/bash
    state: present

- name: Ensure media_root exists
  ansible.builtin.file:
    path: "{{ media_root }}"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: "0755"

- name: Ensure media subdirs exist
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: "0755"
  loop:
    - tv
    - movies
    - downloads
