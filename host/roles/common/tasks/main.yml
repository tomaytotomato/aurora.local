---
- name: Assert supported distro (Debian/Ubuntu only for now)
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      aurora.local host roles currently support Debian/Ubuntu only
      (detected {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      / family {{ ansible_facts['os_family'] }}). TODO: add RHEL-family support
      (dnf, firewalld, etc.).

- name: Set timezone
  community.general.timezone:
    name: "{{ home_timezone }}"

- name: Ensure baseline packages present
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - vim
      - htop
      - tmux
      - rsync
      - unzip
      - lm-sensors
      - avahi-daemon
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# avahi active configuration lives in host/roles/avahi.
# unattended-upgrades active configuration lives in host/roles/unattended-upgrades.
# The packages remain listed above so nothing breaks between plays.

- name: Ensure home user exists in docker group later (placeholder for docker role)
  ansible.builtin.user:
    name: "{{ home_user }}"
    uid: "{{ home_uid }}"
    shell: /bin/bash
    state: present

- name: Ensure media_root exists
  ansible.builtin.file:
    path: "{{ media_root }}"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: "0755"

- name: Ensure media subdirs exist
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ home_user }}"
    group: "{{ home_user }}"
    mode: "0755"
  loop:
    - tv
    - movies
    - downloads
