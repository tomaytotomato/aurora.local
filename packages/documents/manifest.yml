name: documents
title: Documents (Paperless-ngx + Stirling-PDF)
description: |
  Scan or drop in paper — bills, letters, warranties — and it reads the text,
  files it, and makes the lot searchable. Includes tools for splitting,
  merging and converting PDFs.
category: productivity
icon: paperless-ngx

depends_on:
  - core
recommends: []
profiles: {}

ports:
  - {port: 8010, proto: tcp, description: Paperless-ngx web UI}
  - {port: 8020, proto: tcp, description: Stirling-PDF web UI}

requires:
  min_ram_mb: 2048
  min_disk_gb: 10
  host_roles: []
  # A8 (iter-7): 7+-container docs stack (paperless-ngx web + consumer,
  # postgres, redis, tika, gotenberg, etc). Postgres init + paperless
  # index rebuild eat the boot budget; 180s matches media's precedent
  # for stacks of this shape.
  start_budget_seconds: 180

# Paperless runs OCR on every incoming document, which is CPU-bound and
# will happily saturate the box for minutes at a time.
resources:
  mem_limit_mb: 3072
  cpus: 2.0

backup:
  paths:
    - data/documents
  before:
    - kind: postgres-dump
      container: paperless-db
      description: Dumps the Paperless database so the snapshot restores cleanly

required_env:
  - PAPERLESS_ADMIN_USER
  - PAPERLESS_ADMIN_PASSWORD
  - PAPERLESS_SECRET_KEY

# ---- SSO (Phase D) -------------------------------------------------
# Paperless-ngx supports PAPERLESS_ENABLE_HTTP_REMOTE_USER=true —
# Caddy passes Remote-User + Remote-Groups from Authelia, Paperless
# auto-provisions the account on first visit. Stirling-PDF just gets
# edge-gated (no user model of its own). min_role: user because a
# household member should be able to read receipts + shared PDFs.
sso:
  protect: true
  min_role: user
  trusted_headers: true

post_install_notes: |
  1. Drop PDFs / images into ../../data/documents/paperless/consume/
     — Paperless watches it and OCRs on ingest.
  2. PAPERLESS_SECRET_KEY is used to sign session cookies. Treat it
     like a password; rotating it logs everyone out.
  3. Visit https://paperless.$DOMAIN/ for Paperless and
     https://pdf.$DOMAIN/ for Stirling-PDF.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/paperless-ngx/paperless-ngx
homepage_url: https://docs.paperless-ngx.com
