name: documents
title: Documents (Paperless-ngx + Stirling-PDF)
description: |
  Paperless-ngx is a document management system: OCRs paper scans,
  tags them, and gives you a searchable archive. Gotenberg + Apache
  Tika are its office-file and content-extraction sidecars.
  Stirling-PDF is an unrelated but complementary browser-based PDF
  toolkit (split, merge, sign, redact, etc.).

category: productivity

depends_on:
  - core
recommends: []
profiles: {}

ports:
  - {port: 8010, proto: tcp, description: Paperless-ngx web UI}
  - {port: 8020, proto: tcp, description: Stirling-PDF web UI}

requires:
  min_ram_mb: 2048
  min_disk_gb: 10
  host_roles: []
  # A8 (iter-7): 7+-container docs stack (paperless-ngx web + consumer,
  # postgres, redis, tika, gotenberg, etc). Postgres init + paperless
  # index rebuild eat the boot budget; 180s matches media's precedent
  # for stacks of this shape.
  start_budget_seconds: 180

# Paperless runs OCR on every incoming document, which is CPU-bound and
# will happily saturate the box for minutes at a time.
resources:
  mem_limit_mb: 3072
  cpus: 2.0

backup:
  paths:
    - data/documents
  before:
    - kind: postgres-dump
      container: paperless-db
      description: Dumps the Paperless database so the snapshot restores cleanly

required_env:
  - PAPERLESS_ADMIN_USER
  - PAPERLESS_ADMIN_PASSWORD
  - PAPERLESS_SECRET_KEY

post_install_notes: |
  1. Drop PDFs / images into ../../data/documents/paperless/consume/
     — Paperless watches it and OCRs on ingest.
  2. PAPERLESS_SECRET_KEY is used to sign session cookies. Treat it
     like a password; rotating it logs everyone out.
  3. Visit https://paperless.$DOMAIN/ for Paperless and
     https://pdf.$DOMAIN/ for Stirling-PDF.
