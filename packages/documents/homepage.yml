---
# aurora.local / packages/documents / homepage.yml

- Productivity:
    - Paperless-ngx:
        icon: paperless.png
        href: https://paperless.{{HOMEPAGE_VAR_DOMAIN}}/
        description: Document DMS + OCR archive
        container: paperless
        server: my-docker
        widget:
          type: paperlessngx
          url: http://paperless:8000
          username: "{{HOMEPAGE_VAR_PAPERLESS_USER}}"
          password: "{{HOMEPAGE_VAR_PAPERLESS_PASS}}"

    - Stirling-PDF:
        icon: stirling-pdf.png
        href: https://pdf.{{HOMEPAGE_VAR_DOMAIN}}/
        description: Browser PDF toolkit
        container: stirling-pdf
        server: my-docker
