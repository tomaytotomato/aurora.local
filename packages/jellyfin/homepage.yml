# aurora.local / packages/jellyfin / homepage services fragment

- Media:
    - Jellyfin:
        icon: mdi-jellyfin
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}/
        description: Films, TV and music
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
