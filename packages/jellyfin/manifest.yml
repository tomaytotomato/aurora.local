name: jellyfin
title: Media server (Jellyfin)
description: |
  Jellyfin is a free, self-hosted media server: it plays the films, TV,
  and music the arr stack collects, to a browser, a TV app, or a phone.
  No account, no subscription, hardware transcoding included. Seerr
  (in the media package) points at it for requests.

category: media

depends_on:
  - core
recommends:
  - media
  - storage

# One of the interchangeable media players. Others (Plex, Emby) can join
# this group later; the picker offers the group as a single choice.
variant_group: media-player
variant_default: true

profiles: {}

ports:
  - {port: 8096, proto: tcp, description: Jellyfin web UI / API}

requires:
  min_ram_mb: 1024
  min_disk_gb: 4
  host_roles: []
  # Single container, but first-run pulls the image and builds its
  # database; give it room before declaring a failure.
  start_budget_seconds: 90

required_env: []

# Jellyfin serves an unauthenticated /health that returns "Healthy".
probe:
  kind: http_json
  container: jellyfin
  in_cluster_url: http://jellyfin:8096/health
  external_url: http://jellyfin.{domain}/
  auth_treats_401_as_up: true

warnings:
  - id: jellyfin_transcode_cpu
    if: { cpu_threads_lt: 4 }
    message: 'Software transcoding is CPU-heavy. With fewer than 4 threads, enable hardware transcoding or Direct Play only.'

post_install_notes: |
  1. First-run wizard: https://jellyfin.$DOMAIN/ — create the admin
     account (Jellyfin has its own users; it is not behind Authelia).
  2. Add libraries pointing at /data/tv, /data/movies, /data/music —
     these are the same folders the arr stack fills.
  3. In Seerr (packages/media), set the media server to this Jellyfin
     so requests reconcile against what you already have.
  4. Hardware transcoding: uncomment the devices/group_add block in
     compose.yml, then set Playback > Transcoding to VAAPI/QSV. The
     reference box's Intel iGPU does QuickSync.
