# aurora.local / packages/monitoring / prometheus.yml
#
# Bind-mounted read-only into the prometheus container. Reload after
# edits with:  docker exec prometheus killall -HUP prometheus
#
# All targets are addressed by their compose service names on the
# shared aurora_net docker network.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: aurora.local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # ---- Optional app scrape targets ---------------------------------
  # Uncomment as you enable packages. Each *arr app exposes Prometheus
  # metrics only via a plugin; adjust to whatever your services expose.
  #
  # - job_name: caddy
  #   static_configs:
  #     - targets: ['caddy:2019']    # admin API; expose 2019 in caddy
  #
  # - job_name: adguard
  #   metrics_path: /control/stats
  #   static_configs:
  #     - targets: ['adguard:3000']
  #
  # - job_name: gluetun
  #   static_configs:
  #     - targets: ['gluetun:8000']
  #
  # - job_name: uptime-kuma
  #   metrics_path: /metrics
  #   basic_auth: { username: '', password: '' }
  #   static_configs:
  #     - targets: ['uptime-kuma:3001']
