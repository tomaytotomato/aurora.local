# aurora.local / packages/monitoring / grafana dashboards provisioning
#
# Registers a "aurora.local" folder backed by any *.json files dropped
# in this directory. Grafana rescans every 30s.

apiVersion: 1

providers:
  - name: aurora.local
    orgId: 1
    folder: aurora.local
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
