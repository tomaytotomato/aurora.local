name: privacy
title: Privacy (LAN DNS + VPN)
description: |
  Blocks ads and trackers for every device in the house, and gives this
  box's apps their names — photos.aurora.local instead of an IP address
  and a port. Aurora sets it up with your own account; nothing to
  configure.

  It also includes an optional VPN connection that only the download
  apps use, off unless you turn it on.

category: privacy
icon: adguard-home

depends_on:
  - core
recommends: []

profiles:
  torrent:
    description: Start gluetun (needed by media package's torrent profile).
    requires_packages: []

ports:
  - {port: 53,   proto: tcp, description: DNS (bound to LAN IP)}
  - {port: 53,   proto: udp, description: DNS (bound to LAN IP)}
  - {port: 3000, proto: tcp, description: AdGuard}
  - {port: 8000, proto: tcp, description: Gluetun control server, profile: torrent}
  - {port: 8080, proto: tcp, description: qBittorrent WebUI (via gluetun), profile: torrent}

requires:
  min_ram_mb: 512
  min_disk_gb: 2
  host_roles: []
  start_budget_seconds: 60  # gluetun + adguard: allow VPN handshake time.

required_env:
  - VPN_SERVICE_PROVIDER
  - WIREGUARD_PRIVATE_KEY

probe:
  kind: adguard
  container: adguard
  in_cluster_url: http://adguard:3000
  external_url: http://{lan_ip}:3000/

post_install_notes: |
  AdGuard is set up already: it answers DNS for this network and points
  every *.{domain} name at this box. Sign in at https://adguard.{domain}
  with your Aurora username and password.

  To cover every device in the house, set your router's DNS to this box's
  address. Aurora shows you where to do that on the Network screen.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/AdguardTeam/AdGuardHome
homepage_url: https://adguard.com/en/adguard-home/overview.html
