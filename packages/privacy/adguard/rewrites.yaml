# aurora.local / packages/privacy/adguard / rewrites.yaml
#
# LAN DNS rewrites applied by scripts/seed-adguard.sh into
# data/adguard/conf/AdGuardHome.yaml. Idempotent — re-running the
# seed script only adds missing entries, never removes what you've
# added by hand in the UI.
#
# Format matches AdGuardHome's own filtering.rewrites schema so we
# can splice it in verbatim.

rewrites:
  # ${DOMAIN} and ${LAN_IP} are substituted by scripts/seed-adguard.sh from
  # this box's own state — they used to be one particular box's name and
  # address, checked into the repo.

  # Base LAN domain resolves to the box itself.
  - domain: ${DOMAIN}
    answer: ${LAN_IP}
    enabled: true

  # Wildcard: every service Caddy exposes on *.${DOMAIN}.
  - domain: '*.${DOMAIN}'
    answer: ${LAN_IP}
    enabled: true
