# home.local / packages/privacy
#
# AdGuard Home — LAN DNS + ad/tracker blocker. Gluetun (VPN) lands in
# a follow-up commit alongside qBittorrent.

name: home-privacy

networks:
  home_net:
    external: true

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    networks: [home_net]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - ../../data/adguard/work:/opt/adguardhome/work
      - ../../data/adguard/conf:/opt/adguardhome/conf
