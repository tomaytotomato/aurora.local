# aurora.local / packages/git
#
# Forgejo (Gitea community fork) + forgejo-runner for CI.
#
# The runner starts but stays idle until FORGEJO_RUNNER_TOKEN is set in
# .env (see README). Recreate the container after populating the token.

name: aurora-git

networks:
  aurora_net:
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    container_name: forgejo
    restart: unless-stopped
    networks: [aurora_net]
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=${TZ:-Europe/London}
      # First-boot admin bootstrap (Forgejo reads these and creates the
      # user if it doesn't yet exist).
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__server__DOMAIN=git.${DOMAIN:-aurora.local}
      - FORGEJO__server__ROOT_URL=https://git.${DOMAIN:-aurora.local}/
      - FORGEJO__server__SSH_DOMAIN=${DOMAIN:-aurora.local}
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__ADMIN_USER=${FORGEJO_ADMIN_USER}
      - FORGEJO__ADMIN_EMAIL=${FORGEJO_ADMIN_EMAIL}
      - FORGEJO__ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD}
      # ---- Phase D SSO (D12) -------------------------------------------
      # Trust Caddy's Remote-User / Remote-Email headers so an Aurora
      # sign-in propagates into Forgejo without a second login page.
      # Auto-provisioning creates a Forgejo user on first visit; public
      # repos remain public per Forgejo's own ACL — Aurora doesn't
      # strip that out.
      #
      # Safe when SSO is disabled: no Remote-User header → Forgejo
      # falls back to normal /user/login. FORGEJO__ADMIN_USER +
      # PASSWORD are the emergency-access root credentials.
      - FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION=true
      - FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION=true
      - FORGEJO__service__ENABLE_REVERSE_PROXY_EMAIL=true
      - FORGEJO__service__ENABLE_REVERSE_PROXY_FULL_NAME=true
      - FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER=Remote-User
      - FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_EMAIL=Remote-Email
      - FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME=Remote-Name
      # Whitelist the caddy container's IP range on aurora_net. Docker's
      # user-defined bridge nets typically live in 172.17.0.0/16-172.31/16;
      # be permissive here since aurora_net is internal-only and Forgejo
      # falls back to its own login if the header is absent anyway.
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=172.16.0.0/12
    volumes:
      - ../../data/git/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3080:3000"
      - "2222:22"

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:3.5.1
    container_name: forgejo-runner
    restart: unless-stopped
    networks: [aurora_net]
    depends_on:
      - forgejo
    environment:
      - TZ=${TZ:-Europe/London}
      - FORGEJO_INSTANCE_URL=http://forgejo:3000
      - FORGEJO_RUNNER_REGISTRATION_TOKEN=${FORGEJO_RUNNER_TOKEN:-}
      - FORGEJO_RUNNER_NAME=aurora-runner
    volumes:
      - ../../data/git/runner:/data
      # Runner needs docker to spawn job containers.
      - /var/run/docker.sock:/var/run/docker.sock
