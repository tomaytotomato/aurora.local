# aurora.local / packages/mail
#
# docker-mailserver (Postfix + Dovecot + Rspamd + Fail2ban) as the mail
# server, Roundcube as the webmail front end at mail.$DOMAIN.
#
# Bind-mount source paths resolve against packages/core/ (the first -f
# file), NOT this directory — see docs/PACKAGE_CONTRACT.md. Hence
# ../../data/mail/... rather than ./data.

name: aurora-mail

networks:
  aurora_net:
    external: true

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: ${MAIL_HOSTNAME:-mail.aurora.local}
    restart: unless-stopped
    networks: [aurora_net]
    # Standard mail ports, published on the host so external clients and
    # (optionally) the internet can reach Postfix/Dovecot directly. Caddy
    # only ever fronts HTTP, so it cannot proxy these.
    ports:
      - "25:25"     # inbound SMTP / MX
      - "143:143"   # IMAP (STARTTLS)
      - "465:465"   # submission, implicit TLS
      - "587:587"   # submission, STARTTLS
      - "993:993"   # IMAPS
    environment:
      - TZ=${TZ:-Europe/London}
      - OVERRIDE_HOSTNAME=${MAIL_HOSTNAME:-mail.aurora.local}
      - POSTMASTER_ADDRESS=${MAIL_POSTMASTER:-postmaster@aurora.local}
      # Rspamd on, ClamAV off by default — ClamAV roughly doubles the
      # memory footprint. Flip ENABLE_CLAMAV to 1 if the box has room.
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=${MAIL_ENABLE_CLAMAV:-0}
      - ENABLE_FAIL2BAN=1
      # Empty = no server certs yet; the internal Roundcube hop stays
      # plaintext on the trusted network. Set to 'letsencrypt' / 'manual'
      # / 'self-signed' once you have a cert (see README).
      - SSL_TYPE=${MAIL_SSL_TYPE:-}
      # Consolidate all state under the mounted volumes below.
      - ONE_DIR=1
      # Do NOT trust the docker network to relay unauthenticated. Roundcube
      # authenticates on 587 with the user's own credentials instead.
      - PERMIT_DOCKER=none
    volumes:
      - ../../data/mail/maildata:/var/mail
      - ../../data/mail/mailstate:/var/mail-state
      - ../../data/mail/maillogs:/var/log/mail
      - ../../data/mail/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    # Fail2ban manipulates the container's firewall.
    cap_add:
      - NET_ADMIN
    # docker-mailserver ships its own HEALTHCHECK; don't override it.
    stop_grace_period: 1m

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    depends_on:
      - mailserver
    networks: [aurora_net]
    environment:
      - TZ=${TZ:-Europe/London}
      # sqlite keeps contacts/prefs without a second database container.
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      # Plaintext over aurora_net on first run (no server cert yet). Once
      # SSL_TYPE is set on the mail server, switch these to the tls://
      # forms on 993/465 — see the README.
      - ROUNDCUBEMAIL_DEFAULT_HOST=${MAIL_IMAP_HOST:-mailserver}
      - ROUNDCUBEMAIL_DEFAULT_PORT=${MAIL_IMAP_PORT:-143}
      - ROUNDCUBEMAIL_SMTP_SERVER=${MAIL_SMTP_HOST:-mailserver}
      - ROUNDCUBEMAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
    volumes:
      - ../../data/mail/roundcube/db:/var/roundcube/db
      - ../../data/mail/roundcube/config:/var/roundcube/config
    # No host port on purpose. Roundcube serves on :80, reachable only via
    # Caddy at mail.$DOMAIN — which is gated by Authelia (see manifest
    # sso:). Publishing a host port here would let any LAN device reach the
    # webmail directly and walk straight around the Authelia gate.
