# aurora.local / packages/dev
#
# General dev sandbox: code-server (VS Code in browser) plus a Postgres
# 16 and Redis 7 you can point apps at.
#
# Other packages on aurora_net reach these via container name:
#   postgres:5432
#   redis:6379
# Host-side ports are remapped (15432 / 16379) so they don't collide with
# a locally-installed pg/redis.

name: aurora-dev

networks:
  aurora_net:
    external: true

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    networks: [aurora_net]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/London}
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:-}
      - DEFAULT_WORKSPACE=/workspace/aurora.local
    volumes:
      - ../../data/dev/code-server:/config
      # Edit this repo from the browser. UID 1000:1000 by default; if
      # your host user differs, override PUID/PGID in .env.
      - /home/${HOME_USER:-bruce}/aurora.local:/workspace/aurora.local:rw
    ports:
      - "8443:8443"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [aurora_net]
    environment:
      - TZ=${TZ:-Europe/London}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../../data/dev/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks: [aurora_net]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      - TZ=${TZ:-Europe/London}
    volumes:
      - ../../data/dev/redis:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
