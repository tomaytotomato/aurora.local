name: identity
title: Identity (Authelia SSO + 2FA)
description: |
  Authelia provides single sign-on and two-factor authentication in
  front of any other package. It integrates with Caddy via
  forward-auth: a package becomes "protected" simply by adding
  `import authelia` inside its Caddyfile vhost block (the named
  route is defined in this package's caddy.snippet).

  Backend: file-based users database and local SQLite storage. No
  external DB or LDAP required.

category: identity

depends_on:
  - core
recommends: []
profiles: {}

ports:
  - {port: 9091, proto: tcp, description: Authelia HTTP (internal to aurora_net)}

requires:
  min_ram_mb: 256
  min_disk_gb: 1
  host_roles: []

required_env:
  - AUTHELIA_JWT_SECRET
  - AUTHELIA_SESSION_SECRET
  - AUTHELIA_STORAGE_ENCRYPTION_KEY

# Without this block StatusProbeService defaults the probed container name
# to the package name ("identity"), but compose.yml actually names the
# container "authelia" (see container_name: authelia). That mismatch made
# docker.findByName("identity") fail even when Authelia was genuinely up,
# so every live-status surface (Done page checklist, dashboard home,
# app detail status light) reported identity as not-started regardless of
# its real state. Same class of bug already hit dashboard/core and notes;
# this is the identity instance of it.
probe:
  kind: docker
  container: authelia
  external_url: "https://auth.{domain}/"

post_install_notes: |
  1. Generate strong secrets for AUTHELIA_JWT_SECRET,
     AUTHELIA_SESSION_SECRET, AUTHELIA_STORAGE_ENCRYPTION_KEY:
       openssl rand -hex 32
  2. Copy authelia/users_database.example.yml to
     data/identity/authelia/users_database.yml and generate a real
     password hash:
       docker run --rm authelia/authelia:latest \
         authelia crypto hash generate argon2 --password 'yourpassword'
  3. To protect any package, add this inside its Caddy vhost:
       import authelia
     (the named route is defined in identity/caddy.snippet).
  4. First login: https://auth.$DOMAIN — the wizard will guide
     TOTP / WebAuthn enrolment.
