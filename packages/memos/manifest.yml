name: memos
title: Notes (Memos)
description: |
  Somewhere to put a thought in two seconds. Short notes, tags, search. The
  simpler of the two note apps here.
category: productivity
icon: memos

depends_on:
  - core
recommends: []

# The lighter `notes` variant. SilverBullet (package `notes`) is the
# default; this is the alternative.
variant_group: notes
variant_default: false

profiles: {}

ports:
  - {port: 5230, proto: tcp, description: Memos web UI / API}

requires:
  min_ram_mb: 128
  min_disk_gb: 1
  host_roles: []

required_env: []

# The compose service is named `memos`; probe by container so the
# dashboard resolves it directly.
probe:
  kind: docker
  container: memos
  external_url: "http://memos.{domain}/"

post_install_notes: |
  1. First-run: https://memos.$DOMAIN/ — the first account you create
     becomes the host/admin.
  2. Notes and the SQLite database live under ../../data/memos.
  3. Memos has its own accounts; it is not behind Authelia.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/usememos/memos
homepage_url: https://www.usememos.com
