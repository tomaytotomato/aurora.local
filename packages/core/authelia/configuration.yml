###############################################################
# Authelia configuration for aurora.local                     #
#                                                             #
# Bind-mounted read-only into the container at                #
#   /config/configuration.yml                                 #
# Secrets arrive via env vars. Session secret and storage      #
# encryption key rely on Authelia's own env-var-secret         #
# convention; the JWT secret is set explicitly below (as       #
# AURORA_IDENTITY_JWT_SECRET, not AUTHELIA_JWT_SECRET — see    #
# compose.yml for why the container-facing name differs).      #
#                                                             #
# Phase D (Aurora dashboard) manages the users_database.yml   #
# file — see AutheliaService. Do NOT hand-edit that file, it  #
# is regenerated on every user change in Aurora + every 5 min #
# as a drift guard.                                           #
###############################################################

theme: auto

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

# ---- Identity validation (Authelia 4.38+ requires this) ------
# Signs reset / enrollment tokens. Reuses the JWT secret; the two
# subject slots key off different intents so a leaked reset link
# can't be replayed as a session cookie.
#
# Reads AURORA_IDENTITY_JWT_SECRET, not AUTHELIA_JWT_SECRET. The
# latter is on Authelia's own fixed list of legacy "environment
# secret" names and auto-maps onto the deprecated top-level
# jwt_secret key with no template involved — a second mechanism
# acting on the same value as this key. Authelia won't start with
# both present, even when they agree: it refuses to reconcile them
# and this field ends up unset ("option 'jwt_secret' is required").
# compose.yml renames the container-facing env var to sidestep the
# collision; packages/core/.env still calls the secret
# AUTHELIA_JWT_SECRET everywhere outside the container.
identity_validation:
  reset_password:
    jwt_lifespan: 5m
    jwt_algorithm: HS256
    jwt_secret: '{{ env "AURORA_IDENTITY_JWT_SECRET" }}'

# ---- Authentication backend ----------------------------------
# File-based. users_database.yml is projected from Aurora's users
# table (see com.tomaytotomato.aurora.services.AutheliaService).
# `watch: true` reloads on rename; Aurora's projector uses an atomic
# rename so the watcher never sees a half-written file.
authentication_backend:
  password_reset:
    disable: false
  refresh_interval: 5m
  file:
    path: /data/users_database.yml
    watch: true
    password:
      # Aurora hashes admin passwords with BCrypt cost 12 (see
      # AuthService in the dashboard backend). Argon2id was in the
      # original brief but argon2-jvm's JNA-loaded shared object
      # SIGSEGVs under musl/Alpine; the pure-Java pivot is queued
      # for a later phase (see AuthService header). Authelia must
      # match so hashes generated on the Aurora side verify on the
      # Authelia side without a rehash-on-first-login dance.
      algorithm: bcrypt
      bcrypt:
        cost: 12

# ---- Access control ------------------------------------------
# Policies:
#   bypass     — no auth checked (Authelia is out of the request path).
#   one_factor — username + password.
#   two_factor — also require TOTP or WebAuthn.
#
# Group cascade (Aurora → Authelia):
#   Aurora role ADMIN → Authelia groups [admins, users, guests]
#   Aurora role USER  → Authelia groups [users, guests]
#   Aurora role GUEST → Authelia groups [guests]
# So `subject: 'group:users'` in a rule below means
# "authenticated as USER or above" — see AutheliaService.groupsFor().
#
# The base rules here handle the two identities Aurora and Authelia
# both own (auth.DOMAIN and DOMAIN itself). Per-package rules for
# min_role gating are emitted by the Caddy snippet renderer (D6):
# each protected vhost imports `authelia`, and Caddy uses a matcher
# on the Remote-Groups response header to enforce the min_role.
access_control:
  default_policy: deny
  rules:
    # Authelia's own login portal. Bypass so the sign-in page is
    # reachable even when the user has no valid session.
    - domain: 'auth.{{ env "DOMAIN" }}'
      policy: bypass

    # Apex domain — Aurora dashboard. Aurora runs its own
    # username+password flow with server-side sessions, so we
    # bypass Authelia here. Otherwise the two auth systems would
    # fight each other on every request to /.
    - domain: '{{ env "DOMAIN" }}'
      policy: bypass

    # Stalwart's mail admin UI is powerful (create/delete any mailbox),
    # so restrict it to admins. Must precede the *.DOMAIN wildcard below —
    # Authelia takes the first matching rule.
    - domain: 'mail-admin.{{ env "DOMAIN" }}'
      policy: two_factor
      subject: 'group:admins'

    # Default for every *.DOMAIN subdomain: require 2FA. Package
    # manifests that want a laxer policy override via the sso.min_role
    # field (which the Caddy snippet renderer translates to a
    # `Remote-Groups` matcher — see D6). Anyone hitting an unmapped
    # subdomain is denied, per default_policy above.
    - domain: '*.{{ env "DOMAIN" }}'
      policy: two_factor

# ---- Session / cookies ---------------------------------------
# Cookie domain matches the RFC 6265 rule "cookies scoped to the
# apex are sent for every subdomain" — so `authelia_session` set at
# aurora.local flows to notes.aurora.local, grafana.aurora.local, …
# without any explicit per-vhost config. That's what makes SSO
# federated across the whole family.
session:
  name: authelia_session
  same_site: lax
  inactivity: 15m
  expiration: 8h
  remember_me: 1M
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://{{ env "DOMAIN" }}'

# ---- Regulation (brute-force protection) ---------------------
# Three wrong passwords → 5-minute ban. Applies per-username. Not a
# rate limit on Authelia itself; Caddy fronts the health probe and
# absorbs generic HTTP flooding.
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

# ---- Storage -------------------------------------------------
# Postgres on the shared core-db instance (was local SQLite). Encrypted
# at rest with AUTHELIA_STORAGE_ENCRYPTION_KEY (managed by
# IdentitySecretsService). Connection details arrive via
# AUTHELIA_STORAGE_POSTGRES_* env vars set in compose.yml, which Authelia
# maps onto storage.postgres.*; the address/database/username/password
# below are templated from env so this file stays declarative and carries
# no secret. See docs/CORE_SHARED_SERVICES_PLAN.md.
storage:
  encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'
  postgres:
    address: '{{ env "AUTHELIA_STORAGE_POSTGRES_ADDRESS" }}'
    database: '{{ env "AUTHELIA_STORAGE_POSTGRES_DATABASE" }}'
    username: '{{ env "AUTHELIA_STORAGE_POSTGRES_USERNAME" }}'
    password: '{{ env "AUTHELIA_STORAGE_POSTGRES_PASSWORD" }}'

# ---- Notifier ------------------------------------------------
# Aurora provisions an `authelia@$DOMAIN` mailbox on the box's own
# Stalwart (see AutheliaMailProvisionService) and writes the SMTP env
# vars into packages/core/.env. When those are set, Authelia sends
# password-reset and 2FA-enrolment mail through the local mail server
# to `system@$DOMAIN`, which is aliased to the owner's mailbox. When
# they are absent (a box where Aurora has not yet provisioned mail
# because Stalwart is not up yet), Authelia falls back to writing to
# data/authelia/notification.txt so bootstrap still works and no
# recovery link is ever silently dropped.
#
# Both cases share this file: Authelia's template filter (X_AUTHELIA_
# CONFIG_FILTERS=template) resolves the conditional at container start.
# Having both `notifier.smtp` and `notifier.filesystem` at the same
# time is a fatal Authelia config error, so exactly one arm is emitted.
notifier:
  disable_startup_check: false
{{- if env "AUTHELIA_NOTIFIER_SMTP_HOST" }}
  smtp:
    address: 'submission://{{ env "AUTHELIA_NOTIFIER_SMTP_HOST" }}:{{ env "AUTHELIA_NOTIFIER_SMTP_PORT" }}'
    username: '{{ env "AUTHELIA_NOTIFIER_SMTP_USERNAME" }}'
    password: '{{ env "AUTHELIA_NOTIFIER_SMTP_PASSWORD" }}'
    sender: '{{ env "AUTHELIA_NOTIFIER_SMTP_SENDER" }}'
    # Aurora's own Stalwart uses the box's internal TLS root, which
    # Authelia does not trust by default — turn TLS verification off so
    # STARTTLS works against the aurora_net container without shipping
    # the CA into Authelia's trust store. The traffic never leaves the
    # docker bridge, so the threat model this loosens is small.
    tls:
      skip_verify: true
      minimum_version: TLS1.2
{{- else }}
  filesystem:
    filename: /data/notification.txt
{{- end }}

# ---- TOTP defaults -------------------------------------------
# 6-digit code, 30-second period, one-code drift window. Matches
# every mainstream authenticator app (Google / Aegis / 1Password).
totp:
  issuer: 'Aurora ({{ env "DOMAIN" }})'
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1

# ---- WebAuthn / passkeys -------------------------------------
# Passkeys are the recommended second factor over TOTP: no shared
# secret to leak, phishing-resistant, works with hardware keys +
# macOS/iOS/Android platform authenticators.
webauthn:
  disable: false
  display_name: 'Aurora ({{ env "DOMAIN" }})'
  attestation_conveyance_preference: indirect
  timeout: 60s
