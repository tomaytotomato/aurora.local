---
# home.local / homepage / settings.yaml
# https://gethomepage.dev/configs/settings/

title: home.local
description: Opinionated home server — control panel
startUrl: https://home.local/

# ---- theme ----
theme: dark
color: slate
headerStyle: clean
target: _blank
language: en
hideVersion: true
disableCollapse: false
useEqualHeights: true

# ---- dynamic background ----
# Bing image of the day via biturl.top redirect. Rotates once a day.
# Swap for a local file (mounted into /app/config/user/images/bg.jpg
# then reference as /user/images/bg.jpg) if you'd rather curate it.
background:
  image: https://bing.biturl.top/?resolution=1920&format=image
  blur: sm
  saturate: 50
  brightness: 40
  opacity: 60

# ---- 5-group layout — mirrors packages/ ----
layout:
  Core:
    style: row
    columns: 3
    icon: mdi-home-circle-#38bdf8
  Privacy & Security:
    style: row
    columns: 3
    icon: mdi-shield-lock-#a78bfa
  Media:
    style: row
    columns: 4
    icon: mdi-play-circle-#22d3ee
  Storage:
    style: row
    columns: 3
    icon: mdi-database-#f472b6
  External:
    style: row
    columns: 3
    icon: mdi-open-in-new-#94a3b8

# ---- search bar ----
providers:
  searchProvider: duckduckgo

# ---- quick launch (keystroke-driven) ----
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  showSearchSuggestions: true
