# aurora.local / packages/core
#
# Always on. Caddy is the single entry point on :80/:443 and fans out
# to every other package on subdomains under $DOMAIN. Homepage is
# the dashboard aggregating status from every enabled package.
#
# Depends on the external network `aurora_net` (see scripts/up.sh which
# creates it once).

name: aurora-core

networks:
  aurora_net:
    external: true

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    networks: [aurora_net]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-aurora.local}
    extra_hosts:
      # So Caddy can reach services running in host netns (e.g. minidlna).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/caddy/snippets:/etc/caddy/snippets:ro
      - ../../data/caddy/data:/data
      - ../../data/caddy/config:/config
      - ../../data/caddy/logs:/var/log/caddy

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks: [aurora_net]
    # host uid + docker gid so /var/run/docker.sock is readable.
    # scripts/up.sh exports DOCKER_GID from `getent group docker` at
    # run-time; falls back to 998 (Debian bookworm default).
    user: "${HOMEPAGE_UID:-1000}:${DOCKER_GID:-998}"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/London}
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN:-aurora.local},aurora.local,192.168.0.110,localhost
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
