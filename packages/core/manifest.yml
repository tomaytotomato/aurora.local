name: core
title: Core (dashboard + reverse proxy)
description: |
  Always on. Caddy is the single entry point on :80/:443 and fans out
  to every other package on subdomains under $DOMAIN. Aurora
  (packages/dashboard) is the dashboard, reachable at the apex domain.
  Authelia provides SSO + 2FA from Day 0: the auth.$DOMAIN portal and
  the reusable (authelia) forward-auth route live here, and any package
  declaring `sso.protect: true` is gated behind it.
  Stalwart is the box's mail server (SMTP/IMAP/JMAP), always present so
  the system can send and receive mail; its admin UI sits behind Authelia
  at mail-admin.$DOMAIN. Webmail frontends live in their own packages.

category: core
icon: caddy

depends_on: []
recommends: []
profiles: {}

ports:
  - {port: 80,  proto: tcp, description: Caddy HTTP}
  - {port: 443, proto: tcp, description: Caddy HTTPS}
  - {port: 9091, proto: tcp, description: Authelia HTTP (internal to aurora_net)}
  # Stalwart mail server. Published on the host — Caddy is HTTP-only and
  # cannot proxy these; native clients authenticate to Stalwart directly.
  - {port: 25,   proto: tcp, description: Stalwart SMTP (inbound MX)}
  - {port: 143,  proto: tcp, description: Stalwart IMAP (STARTTLS)}
  - {port: 465,  proto: tcp, description: Stalwart submission (implicit TLS)}
  - {port: 587,  proto: tcp, description: Stalwart submission (STARTTLS)}
  - {port: 993,  proto: tcp, description: Stalwart IMAPS}
  - {port: 4190, proto: tcp, description: Stalwart ManageSieve}
  # Stalwart's HTTP admin UI + JMAP are NOT host-published: reachable only
  # via Caddy at mail-admin.$DOMAIN, behind Authelia (admins only).

requires:
  # Bumped from 512: Stalwart budgets ~1 GB on top of Caddy + Authelia.
  min_ram_mb: 1536
  min_disk_gb: 2
  host_roles: []

# Authelia SSO ships in core, so its secrets are required env for the
# core stack. They are auto-generated by scripts/rotate-secrets.sh on
# first bring-up (and by IdentitySecretsService on backend boot).
required_env:
  - AUTHELIA_JWT_SECRET
  - AUTHELIA_SESSION_SECRET
  - AUTHELIA_STORAGE_ENCRYPTION_KEY
  # Stalwart recovery admin password (secret-shaped: rotate-secrets.sh
  # generates it on first bring-up) and the hostname Stalwart calls itself.
  - STALWART_ADMIN_SECRET
  - MAIL_HOSTNAME

# Core's real state now lives in the shared core-db (Postgres): Authelia's
# tables and Stalwart's mail metadata both. A file copy of a live Postgres
# data dir restores into a corrupt database, so the consistent backup is a
# pg_dump of core-db, plus the small on-disk bits that are NOT in Postgres:
# Stalwart's config.json + blob store (data/stalwart) and Authelia's
# users_database.yml + notifications (data/authelia). See
# docs/CORE_SHARED_SERVICES_PLAN.md § Phase 4.
backup:
  paths:
    - data/core-db
    - data/stalwart/etc
    - data/stalwart/lib
    - data/authelia
  before:
    - kind: postgres-dump
      description: Dump the shared core-db (Authelia + Stalwart) so the snapshot restores into a consistent database rather than a copy of live Postgres files.
      container: core-db
      command: "pg_dumpall -U postgres"

probe:
  kind: self
  container: aurora
  external_url: http://{domain}/

post_install_notes: |
  Aurora is running. Open it and finish setup in the browser:

    http://$HOSTNAME.local/     or     http://$LAN_IP/

  Everything else — your admin account, the domain, DNS, certificates and
  apps — happens on screen from there. Nothing left to do at a terminal.

  Mail is already configured: Stalwart shares the core database, boots
  without a setup wizard, and Aurora creates a mailbox for each user you
  add. The recovery admin password is shown in the dashboard under
  Apps → Core → Mail.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/caddyserver/caddy
homepage_url: https://caddyserver.com
