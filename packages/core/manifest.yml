name: core
title: Core (dashboard + reverse proxy)
description: |
  Always on. Caddy is the single entry point on :80/:443 and fans out
  to every other package on subdomains under $DOMAIN. Aurora
  (packages/dashboard) is the dashboard, reachable at the apex domain.
  Authelia provides SSO + 2FA from Day 0: the auth.$DOMAIN portal and
  the reusable (authelia) forward-auth route live here, and any package
  declaring `sso.protect: true` is gated behind it.

category: core
icon: caddy

depends_on: []
recommends: []
profiles: {}

ports:
  - {port: 80,  proto: tcp, description: Caddy HTTP}
  - {port: 443, proto: tcp, description: Caddy HTTPS}
  - {port: 9091, proto: tcp, description: Authelia HTTP (internal to aurora_net)}

requires:
  min_ram_mb: 512
  min_disk_gb: 1
  host_roles: []

# Authelia SSO ships in core, so its secrets are required env for the
# core stack. They are auto-generated by scripts/rotate-secrets.sh on
# first bring-up (and by IdentitySecretsService on backend boot).
required_env:
  - AUTHELIA_JWT_SECRET
  - AUTHELIA_SESSION_SECRET
  - AUTHELIA_STORAGE_ENCRYPTION_KEY

probe:
  kind: self
  container: aurora
  external_url: http://{domain}/

post_install_notes: |
  Install Caddy's root CA on client devices for green padlocks:
    ./scripts/get-caddy-root-cert.sh
  Aurora will be reachable on http://<hostname>.local/ and
  http://$DOMAIN/.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/caddyserver/caddy
homepage_url: https://caddyserver.com
