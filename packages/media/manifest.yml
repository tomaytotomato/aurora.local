name: media
title: Media automation (*arr + requests + downloaders)
description: |
  Finds and downloads the films and shows you follow, keeps them named and
  tidy, and lets the household ask for things. Feeds the media server that
  plays them.
category: media
icon: prowlarr

depends_on:
  - core
recommends:
  - privacy
  - storage

profiles:
  torrent:
    description: Enable qBittorrent behind gluetun.
    requires_packages: [privacy]

ports:
  - {port: 8989, proto: tcp, description: Sonarr}
  - {port: 7878, proto: tcp, description: Radarr}
  - {port: 9696, proto: tcp, description: Prowlarr}
  - {port: 6767, proto: tcp, description: Bazarr}
  - {port: 5055, proto: tcp, description: Seerr}
  - {port: 6500, proto: tcp, description: RDTClient}
  - {port: 8191, proto: tcp, description: Flaresolverr}

requires:
  min_ram_mb: 2048
  min_disk_gb: 20
  host_roles: []
  # iter-3 B4: 7-container stack (flaresolverr, prowlarr, sonarr, radarr,
  # bazarr, rdtclient, seerr) plus first-run image pulls. Give the frontend
  # a generous poll budget before it declares "Couldn't start".
  start_budget_seconds: 180

# iter-3 BL1: user-facing children rendered under the Media row on
# /dashboard/home. Each subpackage gets its own status probe so a
# Prowlarr crash doesn't hide behind a green top-level Media row.
# Order is the order they appear in the UI (roughly the order Sarah
# will need them: indexers → shows → movies → subs → requests).
subpackages:
  - name: prowlarr
    title: Prowlarr
    container: prowlarr
    probe:
      kind: http_json
      in_cluster_url: http://prowlarr:9696/initialize.json
      external_url: http://{lan_ip}:9696/
      auth_treats_401_as_up: true
  - name: sonarr
    title: Sonarr
    container: sonarr
    probe:
      kind: http_json
      in_cluster_url: http://sonarr:8989/initialize.json
      external_url: http://{lan_ip}:8989/
      auth_treats_401_as_up: true
  - name: radarr
    title: Radarr
    container: radarr
    probe:
      kind: http_json
      in_cluster_url: http://radarr:7878/initialize.json
      external_url: http://{lan_ip}:7878/
      auth_treats_401_as_up: true
  - name: bazarr
    title: Bazarr
    container: bazarr
    probe:
      kind: http_json
      in_cluster_url: http://bazarr:6767/
      external_url: http://{lan_ip}:6767/
      auth_treats_401_as_up: true
  - name: seerr
    title: Seerr
    container: seerr
    probe:
      kind: http_json
      in_cluster_url: http://seerr:5055/api/v1/status
      external_url: http://{lan_ip}:5055/
      auth_treats_401_as_up: true

# Seven containers between them. The cap is generous because transcoding
# is legitimately hungry; it exists to stop a stuck import loop taking
# the host with it.
resources:
  mem_limit_mb: 4096
  cpus: 3.0

# The library itself is deliberately not backed up: several terabytes of
# re-downloadable files is not worth the parity space. Configuration is.
backup:
  paths:
    - data/media/config

required_env: []

probe:
  kind: http_json
  container: sonarr
  in_cluster_url: http://sonarr:8989/api/v3/system/status
  external_url: http://sonarr.{domain}/
  auth_treats_401_as_up: true

warnings:
  - id: media_low_cpu
    if: { cpu_threads_lt: 4 }
    message: 'The *arr stack runs 7 services. It is happier with 4+ CPU threads.'
  - id: media_low_disk
    if: { free_disk_gb_below: 50 }
    message: 'Media library needs disk headroom. Aurora sees less than 50 GB free on the largest drive.'

post_install_notes: |
  1. Set the download client(s) in Sonarr/Radarr Settings > Download Clients.
  2. Add Prowlarr as the indexer source in Sonarr/Radarr Settings > Indexers.
  3. Point Seerr at your Jellyfin/Plex server.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/Sonarr/Sonarr
homepage_url: https://sonarr.tv
