name: media
title: Media automation (*arr + requests + downloaders)
description: |
  Debrid-first (RDTClient) with qBittorrent-behind-gluetun as the local
  fallback. Sonarr/Radarr/Bazarr/Prowlarr do the automation, Seerr
  handles requests, Flaresolverr rides shotgun on Cloudflare challenges.

category: media

depends_on:
  - core
recommends:
  - privacy
  - storage

profiles:
  torrent:
    description: Enable qBittorrent behind gluetun.
    requires_packages: [privacy]

ports:
  - {port: 8989, proto: tcp, description: Sonarr}
  - {port: 7878, proto: tcp, description: Radarr}
  - {port: 9696, proto: tcp, description: Prowlarr}
  - {port: 6767, proto: tcp, description: Bazarr}
  - {port: 5055, proto: tcp, description: Seerr}
  - {port: 6500, proto: tcp, description: RDTClient}
  - {port: 8191, proto: tcp, description: Flaresolverr}

requires:
  min_ram_mb: 2048
  min_disk_gb: 20
  host_roles: []

required_env: []

post_install_notes: |
  1. Set the download client(s) in Sonarr/Radarr Settings > Download Clients.
  2. Add Prowlarr as the indexer source in Sonarr/Radarr Settings > Indexers.
  3. Point Seerr at your Jellyfin/Plex server.
