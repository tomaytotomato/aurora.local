# home.local / packages/media
#
# Arr stack + Debrid bridge (RDTClient) + Flaresolverr for cloudflare
# challenges Prowlarr hits. qBittorrent still to come.

name: home-media

x-arr-common: &arr-common
  restart: unless-stopped
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/London}

services:
  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    volumes:
      - ../../data/sonarr:/config
      - /home/bruce/media/tv:/tv
      - /home/bruce/media/downloads:/downloads

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    volumes:
      - ../../data/radarr:/config
      - /home/bruce/media/movies:/movies
      - /home/bruce/media/downloads:/downloads

  prowlarr:
    <<: *arr-common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes:
      - ../../data/prowlarr:/config

  bazarr:
    <<: *arr-common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports: ["6767:6767"]
    volumes:
      - ../../data/bazarr:/config
      - /home/bruce/media/tv:/tv
      - /home/bruce/media/movies:/movies

  rdtclient:
    <<: *arr-common
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    ports: ["6500:6500"]
    volumes:
      - ../../data/rdtclient/data:/data/db
      - /home/bruce/media/downloads:/data/downloads

  flaresolverr:
    <<: *arr-common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports: ["8191:8191"]
    environment:
      - TZ=${TZ:-Europe/London}
      - LOG_LEVEL=info

  jellyseerr:
    <<: *arr-common
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports: ["5055:5055"]
    volumes:
      - ../../data/jellyseerr:/app/config
