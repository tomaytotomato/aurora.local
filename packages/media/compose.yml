# home.local / packages/media
#
# Arr stack. Debrid + torrent client come in a later commit.

name: home-media

x-arr-common: &arr-common
  restart: unless-stopped
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/London}

services:
  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    volumes:
      - ../../data/sonarr:/config
      - /home/bruce/media/tv:/tv
      - /home/bruce/media/downloads:/downloads

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    volumes:
      - ../../data/radarr:/config
      - /home/bruce/media/movies:/movies
      - /home/bruce/media/downloads:/downloads

  prowlarr:
    <<: *arr-common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes:
      - ../../data/prowlarr:/config

  bazarr:
    <<: *arr-common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports: ["6767:6767"]
    volumes:
      - ../../data/bazarr:/config
      - /home/bruce/media/tv:/tv
      - /home/bruce/media/movies:/movies
