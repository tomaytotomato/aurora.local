openapi: 3.1.0
info:
  title: Aurora Dashboard API
  version: 0.3.0
  description: >
    Admin-plane API for aurora.local. Same-origin, cookie-authenticated
    (session cookie set by POST /auth/login). All paths below are served
    under the `/api` prefix by the Spring Boot backend; the Vite dev
    server proxies `/api` to :8090.


    This spec is hand-authored from the typed frontend `src/api/*`
    modules and is the source of truth the MSW mock layer answers to.
    Field casing is deliberately mixed: most bodies are camelCase, but a
    handful of endpoints emit snake_case verbatim from the backend
    (onboarding draft/plan/launch, services, containers logs, security
    dismissals, audit). Casing here matches the wire, not a convention.
servers:
  - url: /api
    description: Same-origin, behind Caddy / Vite proxy.

tags:
  - name: auth
  - name: onboarding
  - name: packages
  - name: services
  - name: containers
  - name: metrics
  - name: security
  - name: audit
  - name: system
  - name: mdns
  - name: vpn
  - name: users
  - name: updates
  - name: jobs
  - name: backup
  - name: disks
  - name: notifications
  - name: network
  - name: proxy
  - name: custom

security:
  - sessionCookie: []

paths:
  # ─────────────────────────────── auth ───────────────────────────────
  /auth/session:
    get:
      tags: [auth]
      summary: Current session
      security: []
      responses:
        '200':
          description: Session state (authenticated may be false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                tz:
                  type: string
                  description: >
                    IANA timezone. Read by
                    OnboardingService.createInitialAdmin, which sets the
                    box's timezone from it; the wizard has always sent it.
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Bad credentials.
  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in user, or 401
      description: >
        Sibling of /auth/session. Public in SecurityConfig so the SPA can
        ask before it knows whether it has a session.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: Not signed in. }
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out; clears the session cookie
      responses:
        '204': { description: Logged out. }
  /auth/password:
    post:
      tags: [auth]
      summary: Self-service password change for the current operator
      description: >-
        Rotate the signed-in operator's password after verifying the
        current one. Distinct from POST /users/{id}/password: that one
        is admin-driven and echoes the new plaintext back so the admin
        can hand it over; this one requires the caller to prove
        knowledge of the current password and returns nothing. Requires
        the new password to be at least 12 characters and different
        from the current one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordReq' }
      responses:
        '204': { description: Password rotated. }
        '400': { description: New password is too short, matches the current one, or was rejected by the user-service validator. }
        '401': { description: Not signed in, or the current password did not verify. }

  # ──────────────────────────── onboarding ────────────────────────────
  /onboarding:
    get:
      tags: [onboarding]
      summary: Full onboarding draft (hydration)
      security: []
      responses:
        '200':
          description: Draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDraft' }
    patch:
      tags: [onboarding]
      summary: Partial update of any draft field
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingPatch' }
      responses:
        '200':
          description: Updated draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingDraft' }
        '409':
          description: No admin yet, or wizard already committed.
  /onboarding/status:
    get:
      tags: [onboarding]
      deprecated: true
      summary: Legacy status shape (use GET /onboarding)
      security: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
  /onboarding/env:
    get:
      tags: [onboarding]
      summary: Box facts safe to expose pre-login
      security: []
      responses:
        '200':
          description: Environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingEnv' }
  /onboarding/admin:
    post:
      tags: [onboarding]
      summary: One-shot bootstrap of the initial admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                tz:
                  type: string
                  description: >
                    IANA timezone. Read by
                    OnboardingService.createInitialAdmin, which sets the
                    box's timezone from it; the wizard has always sent it.
      responses:
        '204': { description: Admin created. }
        '409': { description: Admin already exists. }
  /onboarding/plan:
    get:
      tags: [onboarding]
      summary: Install plan (optionally scoped to a speculative enabled set)
      security: []
      parameters:
        - name: enabled
          in: query
          required: false
          description: CSV of package names to preview instead of on-disk state.
          schema: { type: string }
      responses:
        '200':
          description: Plan (snake_case wire shape).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanWire' }
  /onboarding/install:
    post:
      tags: [onboarding]
      summary: Apply the plan to .state.yml (does not spawn containers in v0.1)
      responses:
        '200':
          description: Install result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallResult' }
  /onboarding/launch:
    post:
      tags: [onboarding]
      summary: Kick off scripts/up.sh for the enabled packages
      responses:
        '202':
          description: Launch job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchStart' }
  /onboarding/launch/{id}:
    get:
      tags: [onboarding]
      summary: Snapshot of a launch job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Launch status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchStatus' }
        '404': { description: Unknown job. }
  /onboarding/launch/{id}/stream:
    get:
      tags: [onboarding]
      summary: SSE — live launch log + terminal state
      description: >
        Server-Sent Events. Emits `log` events (one line per message),
        `ping` keepalives, and a terminal `done` event carrying the final
        LaunchStatus.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /onboarding/sso:
    get:
      tags: [onboarding]
      summary: Second-factor enrollment progress
      description: >-
        Drives the wizard's "Set up SSO" step. Readable without a session
        because the step runs before POST /onboarding/complete establishes
        one. pendingUrl is withheld once onboarding is complete: it is a
        bearer capability that lets whoever opens it bind an authenticator
        to an account, so after that point the authenticated
        GET /sso/status serves it instead.
      responses:
        '200':
          description: Enrollment status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoEnrollment' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      summary: Commit the wizard
      responses:
        '204': { description: Completed. }

  # ─────────────────────────────── sso ────────────────────────────────
  /sso/status:
    get:
      tags: [sso]
      summary: Second-factor enrollment state
      description: >-
        Authenticated counterpart to GET /onboarding/sso. This is the
        variant allowed to return a pending registration link, because by
        this point the box has real users and such a link must not be
        readable by an anonymous LAN client.
      responses:
        '200':
          description: Enrollment status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoEnrollment' }
  /sso/notifications:
    get:
      tags: [sso]
      summary: Recent Authelia notifier entries
      description: >-
        Newest-first list of the last N notifications Authelia wrote to
        its filesystem notifier (data/authelia/notification.txt). Every
        entry can carry an OTP or a link that binds an authenticator to
        an account, so the endpoint is authenticated -- serving it
        anonymously would hand any LAN client a standing takeover
        primitive.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Entries to return, capped at 20. Non-positive values fall
            back to 5.
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SsoNotification' }

  # ───────────────────────────── packages ─────────────────────────────
  /packages:
    get:
      tags: [packages]
      summary: List packages
      responses:
        '200':
          description: Summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackageSummary' }
  /packages/{name}:
    get:
      tags: [packages]
      summary: Package detail
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '200':
          description: Detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageDetail' }
        '404': { description: Unknown package. }
  /packages/{name}/env:
    get:
      tags: [packages]
      summary: Read env vars (secrets masked unless reveal=1)
      parameters:
        - { $ref: '#/components/parameters/PkgName' }
        - name: reveal
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        '200':
          description: Key/value map.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
    put:
      tags: [packages]
      summary: Write env vars
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '204': { description: Saved. }
  /packages/{name}/enable:
    post:
      tags: [packages]
      summary: Enable and start a package
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /packages/{name}/disable:
    post:
      tags: [packages]
      summary: Stop and disable a package
      description: >
        Uninstall: stops the package's containers and removes it from
        .state.yml's enabled[]. Reversible only by installing again.
        Data under data/<name> is left on disk.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /packages/{name}/stop:
    post:
      tags: [packages]
      summary: Stop a package without uninstalling it
      description: >
        Disable: stops the package's containers but leaves it enrolled in
        .state.yml's enabled[], so a plain Start brings it back with no
        reinstall. The counterpart to /enable and /disable, which both
        change enrolment as well as run state.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /packages/{name}/restart:
    post:
      tags: [packages]
      summary: Restart a package
      description: >
        Returns a job rather than a 204. A restart is unbounded — gluetun
        re-does a VPN handshake, Immich re-opens a database — so holding an
        HTTP request open for it and returning no log if it fails is worse
        than the streamed job every other lifecycle verb gets. JobKind has
        carried `restart` since before this endpoint was implemented.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '403': { description: Core packages can't be restarted from here. }
        '404': { description: Unknown package. }
        '422': { description: Package is not installed. }
  /packages/{name}/upgrade:
    post:
      tags: [packages]
      summary: Pull latest images and recreate
      description: >
        Scoped to the one named package, not the whole box. The button
        lives on a single app's page, so updating everything — including
        recreating the dashboard the click came from — would be a surprise
        rather than a feature.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '403': { description: Core packages can't be upgraded from here. }
        '404': { description: Unknown package. }
        '422': { description: Package is not installed. }

  /packages/{name}/resources:
    get:
      tags: [packages]
      summary: Memory and CPU ceilings, and live usage
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '200':
          description: Resource state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageResources' }
    put:
      tags: [packages]
      summary: Override the ceilings
      description: >
        Null on either field clears the override and restores the
        manifest default. New limits apply the next time the package
        restarts.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memLimitMb, cpus]
              properties:
                memLimitMb: { type: [integer, 'null'] }
                cpus: { type: [number, 'null'] }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageResources' }

  # ─────────────────────── previously undocumented ────────────────────
  # Endpoints that existed in the backend before anything checked the
  # controllers against this file. Found by OpenApiConformanceTest.
  /health:
    get:
      tags: [system]
      summary: Liveness and basic box facts
      description: Public — the only /api route reachable without a session.
      responses:
        '200':
          description: Health.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /state:
    get:
      tags: [system]
      summary: Parsed .state.yml
      responses:
        '200':
          description: Repo state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateFile' }
  /system/snapshot:
    get:
      tags: [system]
      summary: Host resource snapshot used by the onboarding warnings
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /events:
    get:
      tags: [system]
      summary: SSE — box-wide event stream
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /onboarding/domain:
    post:
      tags: [onboarding]
      summary: Set the domain during the wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string }
      responses:
        '204': { description: Saved. }
        '400': { description: The domain is not usable. }
  /onboarding/packages:
    post:
      tags: [onboarding]
      summary: Set the enabled packages during the wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packages:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Saved. }

  # ────────────────────────────── updates ─────────────────────────────
  # Read-only. Applying an update goes through
  # POST /packages/{name}/upgrade, which already exists and already
  # returns a job id — there is deliberately no second update verb.
  /updates:
    get:
      tags: [updates]
      summary: Update availability for every package
      responses:
        '200':
          description: One row per package, in catalogue order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackageUpdate' }
  /updates/{name}:
    get:
      tags: [updates]
      summary: Update availability for one package
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '200':
          description: Update row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageUpdate' }
        '404': { description: Unknown package. }
  /updates/check:
    post:
      tags: [updates]
      summary: Re-query every registry
      description: >
        Returns a job rather than blocking: checking nine registries takes
        long enough that the operator should see it happening.
      responses:
        '202':
          description: Check job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }

  # ─────────────────────────────── jobs ───────────────────────────────
  /jobs:
    get:
      tags: [jobs]
      summary: List jobs, newest first
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/JobState' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/JobKind' }
      responses:
        '200':
          description: Job summaries without their logs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobSummary' }
  /jobs/{id}:
    get:
      tags: [jobs]
      summary: Snapshot of one job, including its log so far
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '404': { description: Unknown job. }
  /jobs/{id}/stream:
    get:
      tags: [jobs]
      summary: SSE — live job log + terminal state
      description: >
        Server-Sent Events. Replays the lines already produced, then emits
        `log` events (one line per message), `ping` keepalives, and a
        terminal `done` carrying the final JobStatus as JSON. Opening the
        stream of an already-finished job replays its whole tail and then
        terminates immediately, so a log stays readable after the fact.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { description: Unknown job. }

  # ────────────────────────────── backup ──────────────────────────────
  # Aurora reports on Kopia rather than replacing it: repository
  # management and the snapshot browser stay in Kopia's own UI.
  # See docs/BACKUP_PAGE_DESIGN.md.
  /backup/status:
    get:
      tags: [backup]
      summary: Repository state, last run, size
      responses:
        '200':
          description: Backup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupStatus' }
  /backup/sources:
    get:
      tags: [backup]
      summary: The paths being protected
      responses:
        '200':
          description: One row per source.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BackupSource' }
  /backup/sources/{id}:
    patch:
      tags: [backup]
      summary: Turn a source on or off
      parameters:
        - $ref: '#/components/parameters/BackupSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The updated source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSource' }
        '404': { description: Unknown source. }
  /backup/snapshots:
    get:
      tags: [backup]
      summary: Snapshot history, newest first
      parameters:
        - name: sourceId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Snapshot' }
    post:
      tags: [backup]
      summary: Back up now
      responses:
        '202':
          description: Backup job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /backup/snapshots/{id}/restore:
    post:
      tags: [backup]
      summary: Restore a whole snapshot to its original path
      description: >
        Deliberately the plainest flow there is: whole source, whole
        snapshot, original location. Per-file and restore-elsewhere are
        out of scope and stay in Kopia's UI.
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '202':
          description: Restore job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '404': { description: Unknown snapshot. }
  /backup/policy:
    get:
      tags: [backup]
      summary: Schedule, retention and the staleness threshold
      responses:
        '200':
          description: Policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
    put:
      tags: [backup]
      summary: Save the policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupPolicy' }
      responses:
        '200':
          description: The saved policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }

  # ─────────────────────────────── disks ──────────────────────────────
  # Read-only, plus the two SnapRAID operations that are safe to run at
  # any time. Formatting, partitioning and pool membership stay in
  # group_vars and Ansible on purpose: a UI that can repartition a disk
  # is a UI that can destroy a library at 11pm.
  # See docs/DISKS_PAGE_DESIGN.md.
  /disks:
    get:
      tags: [disks]
      summary: Every physical disk, with its SMART summary
      responses:
        '200':
          description: Disks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Disk' }
  /disks/pool:
    get:
      tags: [disks]
      summary: The mergerfs pool and its branches
      responses:
        '200':
          description: Pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pool' }
  /disks/parity:
    get:
      tags: [disks]
      summary: SnapRAID parity freshness
      responses:
        '200':
          description: Parity state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parity' }
  /disks/parity/sync:
    post:
      tags: [disks]
      summary: Bring parity up to date
      responses:
        '202':
          description: Sync job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /disks/parity/scrub:
    post:
      tags: [disks]
      summary: Verify existing parity against the data
      responses:
        '202':
          description: Scrub job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /disks/{id}/smart:
    get:
      tags: [disks]
      summary: Full SMART attribute table for one disk
      parameters:
        - $ref: '#/components/parameters/DiskId'
      responses:
        '200':
          description: >
            Attributes, or `supported` false for a drive that has none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiskSmart' }
        '404': { description: Unknown disk. }

  # ────────────────────────── notifications ───────────────────────────
  # Aurora detects service failures, security findings, backup failures
  # and drive trouble already, and until now told nobody. Email is
  # deliberately not a channel kind: a working MTA on a home box is a
  # multi-hour yak shave that ends in a spam folder.
  /notifications/channels:
    get:
      tags: [notifications]
      summary: Configured notification channels
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationChannel' }
    post:
      tags: [notifications]
      summary: Add a channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelDraft' }
      responses:
        '201':
          description: The created channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
  /notifications/channels/{id}:
    patch:
      tags: [notifications]
      summary: Change a channel, or mute it
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelPatch' }
      responses:
        '200':
          description: The updated channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '404': { description: Unknown channel. }
    delete:
      tags: [notifications]
      summary: Remove a channel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { description: Removed. }
  /notifications/channels/{id}/test:
    post:
      tags: [notifications]
      summary: Send a test message now
      description: >
        Reports what actually happened rather than acknowledging the
        attempt. A channel that has silently stopped working is worse
        than no channel, because you believe you are covered.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Delivery outcome.
          content:
            application/json:
              schema:
                type: object
                required: [result, error]
                properties:
                  result: { type: string, enum: [ok, failed] }
                  error: { type: [string, 'null'] }
        '404': { description: Unknown channel. }
  /notifications/history:
    get:
      tags: [notifications]
      summary: What Aurora has sent, newest first
      responses:
        '200':
          description: Deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationDelivery' }

  # ────────────────────────────── network ─────────────────────────────
  # Outbound: which apps egress through the VPN gateway. The mechanism is
  # container network-namespace sharing (network_mode: service:gluetun),
  # chosen over host-level policy routing precisely because it is safe to
  # flip from a UI without rewriting the host's routing table. See
  # docs/SPLIT_TUNNEL.md.
  #
  # Inbound: rate limiting, geo-blocking and bot filtering in Caddy in
  # front of anything exposed past the LAN.
  /packages/{name}/network:
    get:
      tags: [network]
      summary: How this app's traffic leaves the box
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '200':
          description: Egress state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageNetwork' }
    put:
      tags: [network]
      summary: Move this app on or off the VPN gateway
      description: >
        Rewrites the app's network_mode, moves its published ports onto
        the gateway, re-points its Caddy vhost, and restarts it. Returns a
        job because containers go down and come back.
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/EgressMode' }
      responses:
        '202':
          description: Restart job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '409':
          description: >
            This app's egress cannot be changed — it is the gateway
            itself, or it has to answer on the LAN directly.
  /protection:
    get:
      tags: [network]
      summary: What sits in front of each vhost
      responses:
        '200':
          description: One row per vhost.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VhostProtection' }
  /protection/{vhost}:
    put:
      tags: [network]
      summary: Change the protection on one vhost
      parameters:
        - $ref: '#/components/parameters/Vhost'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rateLimit: { $ref: '#/components/schemas/RateLimit' }
                geoBlock: { $ref: '#/components/schemas/GeoBlock' }
                botDetection: { type: boolean }
      responses:
        '200':
          description: The updated row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VhostProtection' }
        '404': { description: Unknown vhost. }

  # ─────────────────────────────── proxy ──────────────────────────────
  # Exposing a container at a friendly address without hand-editing
  # caddy.snippet. The file stays the source of truth and stays in git;
  # Aurora writes a fragment and Caddy's existing --watch reloads. The
  # preview endpoint exists so the exact fragment can be shown before
  # anything is written.
  /proxy/routes:
    get:
      tags: [proxy]
      summary: Every vhost Caddy answers to
      responses:
        '200':
          description: Routes, both manifest-generated and hand-added.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProxyRoute' }
    post:
      tags: [proxy]
      summary: Point a new address at a container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subdomain, target]
              properties:
                subdomain: { type: string }
                target: { type: string }
      responses:
        '201':
          description: The created route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyRoute' }
        '409': { description: The name is taken or reserved. }
  /proxy/routes/{id}:
    delete:
      tags: [proxy]
      summary: Remove a hand-added route
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '204': { description: Removed. }
        '409': { description: The route comes from a package manifest. }
  /proxy/targets:
    get:
      tags: [proxy]
      summary: Containers worth pointing an address at
      responses:
        '200':
          description: Targets with the ports they listen on.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProxyTarget' }
  /proxy/preview:
    post:
      tags: [proxy]
      summary: Dry run — the fragment that would be written, and what it clashes with
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subdomain, target]
              properties:
                subdomain: { type: string }
                target: { type: string }
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPreview' }

  # ────────────────────────────── custom ──────────────────────────────
  # Operator-supplied compose files. The curated catalogue stays the
  # default and the only recommended path; these are listed separately
  # everywhere and never enter the dependency graph.
  # See docs/CUSTOM_STACK_DESIGN.md.
  /custom/stacks:
    get:
      tags: [custom]
      summary: List custom stacks
      responses:
        '200':
          description: Stacks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomStack' }
    post:
      tags: [custom]
      summary: Save a stack without running it
      description: >
        Saving and deploying are separate steps. A stack that exists but
        has never run is a useful state — it is how a draft is kept while
        the problems are worked out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, composeYaml]
              properties:
                name: { type: string }
                composeYaml: { type: string }
      responses:
        '201':
          description: The saved stack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomStack' }
        '400': { description: The file has blocking problems. }
  /custom/stacks/validate:
    post:
      tags: [custom]
      summary: Dry run — what the file contains and what Aurora thinks of it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [composeYaml]
              properties:
                composeYaml: { type: string }
      responses:
        '200':
          description: Two-tier report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StackValidation' }
  /custom/stacks/{id}:
    put:
      tags: [custom]
      summary: Edit a stack
      parameters:
        - $ref: '#/components/parameters/StackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                composeYaml: { type: string }
      responses:
        '200':
          description: The updated stack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomStack' }
        '404': { description: Unknown stack. }
    delete:
      tags: [custom]
      summary: Stop and remove a stack
      parameters:
        - $ref: '#/components/parameters/StackId'
      responses:
        '204': { description: Removed. }
  /custom/stacks/{id}/deploy:
    post:
      tags: [custom]
      summary: Bring a stack up
      parameters:
        - $ref: '#/components/parameters/StackId'
      responses:
        '202':
          description: Deploy job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '404': { description: Unknown stack. }
  /custom/stacks/{id}/stop:
    post:
      tags: [custom]
      summary: Take a stack down
      parameters:
        - $ref: '#/components/parameters/StackId'
      responses:
        '202':
          description: Stop job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '404': { description: Unknown stack. }

  # ───────────────────────────── services ─────────────────────────────
  /services/status:
    get:
      tags: [services]
      summary: Per-package live status probes
      responses:
        '200':
          description: Status snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicesStatusResponse' }
  /services/status/stream:
    get:
      tags: [services]
      summary: SSE — live per-package status
      description: Server-Sent Events; each message is a ServicesStatusResponse JSON payload.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /services/{package}/start:
    post:
      tags: [services]
      summary: Launch a single package post-onboarding
      parameters: [{ $ref: '#/components/parameters/PkgName' }]
      responses:
        '202':
          description: Start job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStartResponse' }

  # ──────────────────────────── containers ────────────────────────────
  /containers:
    get:
      tags: [containers]
      summary: List containers, optionally filtered to a package
      parameters:
        - name: package
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Containers ([] when filter matches nothing).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContainerInfo' }
  /containers/events:
    get:
      tags: [containers]
      summary: Snapshot of the container-event ring buffer (oldest first)
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContainerEventItem' }
  /containers/events/stream:
    get:
      tags: [containers]
      summary: SSE — replays buffer then live container events
      description: Server-Sent Events named `container-event`; data is a ContainerEventItem.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /containers/{id}/logs:
    get:
      tags: [containers]
      summary: Tail a container's logs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: tail
          in: query
          description: Lines to return; backend clamps to [1, 2000].
          schema: { type: integer, default: 200 }
      responses:
        '200':
          description: Log lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerLogsResponse' }

  # ───────────────────────────── metrics ──────────────────────────────
  /metrics/keys:
    get:
      tags: [metrics]
      summary: Distinct metric keys, optionally filtered by prefix
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /metrics/last24h:
    get:
      tags: [metrics]
      summary: Bucketed last-24h series for one key
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: bucketMinutes
          in: query
          schema: { type: integer, enum: [1, 2, 5, 10, 15, 30, 60], default: 5 }
      responses:
        '200':
          description: Buckets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricBucket' }

  # ───────────────────────────── security ─────────────────────────────
  /security/findings:
    get:
      tags: [security]
      summary: Current findings (HIGH → MEDIUM → LOW, render-ready)
      parameters:
        - name: includeDismissed
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Findings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecurityFinding' }
  /security/findings/{id}/dismiss:
    post:
      tags: [security]
      summary: Dismiss or snooze a finding
      parameters: [{ $ref: '#/components/parameters/FindingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer, minimum: 1, maximum: 365, description: Omit or 0 for permanent. }
                reason: { type: string, maxLength: 512 }
      responses:
        '204': { description: Dismissed. }
    delete:
      tags: [security]
      summary: Restore a dismissed finding
      parameters: [{ $ref: '#/components/parameters/FindingId' }]
      responses:
        '204': { description: Restored. }
  /security/dismissals:
    get:
      tags: [security]
      summary: Currently suppressed findings
      responses:
        '200':
          description: Dismissals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DismissalRow' }

  /security/hardening:
    get:
      tags: [security]
      summary: Where the three outstanding hardening decisions stand
      description: >
        State, not control. Pinning, sops encryption and the socket proxy
        are each an Ansible run or a script that rewrites files on disk,
        so there is deliberately no endpoint to perform them from the
        dashboard.
      responses:
        '200':
          description: Hardening state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HardeningState' }

  # ────────────────────────────── audit ───────────────────────────────
  /audit/events:
    get:
      tags: [audit]
      summary: Audit events (newest first)
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: integer }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

  # ────────────────────────────── system ──────────────────────────────
  /system:
    get:
      tags: [system]
      summary: Host + capability summary
      responses:
        '200':
          description: System info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
  /system/metrics:
    get:
      tags: [system]
      summary: Coarse host metric samples
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: ['1h', '24h', '7d'], default: '24h' }
      responses:
        '200':
          description: Samples.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSample' }
  /system/state:
    get:
      tags: [system]
      summary: Parsed .state.yml
      responses:
        '200':
          description: State file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateFile' }
  /system/export:
    get:
      tags: [system]
      summary: A portable copy of how this box is set up
      description: >
        Carries no secrets: .env values stay on the box, which is what
        makes this file safe to keep alongside ordinary backups, and also
        why an import can never be the whole story.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsExport' }
  /system/import:
    post:
      tags: [system]
      summary: Apply an exported file
      parameters:
        - name: preview
          in: query
          description: Dry run. The default in the UI, because an import that silently enables nine packages should not be discovered afterwards.
          schema: { type: integer, enum: [1] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: What changed, or would.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { description: The file came from a different version. }

  /system/caddy-root.crt:
    get:
      tags: [system]
      summary: Caddy root CA certificate (for client HTTPS trust)
      security: []
      responses:
        '200':
          description: PEM certificate.
          content:
            application/x-x509-ca-cert:
              schema: { type: string }

  # ─────────────────────────────── mdns ───────────────────────────────
  /mdns/aliases:
    get:
      tags: [mdns]
      summary: List published mDNS aliases
      responses:
        '200':
          description: Aliases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MdnsAliasPayload' }
  /mdns/reconcile:
    post:
      tags: [mdns]
      summary: Force a republish
      responses:
        '200':
          description: Aliases after reconcile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MdnsAliasPayload' }

  # ─────────────────────────────── users ─────────────────────────────
  /users:
    get:
      tags: [users]
      summary: List users
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
                password:
                  type: string
                  minLength: 8
                  description: >-
                    Optional. Omit or leave blank and Aurora generates a strong
                    passphrase, returned once as generatedPassword.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '409': { description: Username already taken. }
  /users/{id}/password:
    post:
      tags: [users]
      summary: Reset a password, generating one when none is supplied
      description: >-
        Separate from PUT /users/{id} because this returns a secret, and
        conflating "here is the updated user" with "here is a plaintext
        credential" invites the latter into logs and caches that only ever
        expected the former. The plaintext is returned exactly once and is
        stored nowhere.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPassword' }
        '404': { description: No such user. }
  /users/{id}:
    get:
      tags: [users]
      summary: One user
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: Unknown user. }
    put:
      tags: [users]
      summary: Update a user's role or password
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: Unknown user. }
    delete:
      tags: [users]
      summary: Remove a user
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Removed. }
        '409': { description: Cannot remove your own account. }

  # ─────────────────────────────── vpn ────────────────────────────────
  # Aurora's own inbound VPN server for remote access into the LAN.
  # NOT packages/privacy's Gluetun sidecar (an outbound client tunnel
  # for the media stack) — see docs/VPN_PAGE_DESIGN.md.
  /vpn/status:
    get:
      tags: [vpn]
      summary: Live tunnel status snapshot
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnStatus' }
  /vpn/status/stream:
    get:
      tags: [vpn]
      summary: SSE — live tunnel status
      description: Server-Sent Events named `vpn-status`; payload is a VpnStatus.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /vpn/config:
    get:
      tags: [vpn]
      summary: Current server/tunnel configuration
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnConfig' }
        '404': { description: Not configured yet — call POST /vpn/config/init first. }
    put:
      tags: [vpn]
      summary: Update the server/tunnel configuration
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VpnConfig' }
      responses:
        '200':
          description: Updated config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnConfig' }
    delete:
      tags: [vpn]
      summary: Remove the server configuration and every peer
      description: >
        Undoes POST /vpn/config/init, returning the box to its
        not-configured state. Destructive: the server keypair is
        discarded and every peer is deleted, because a peer's issued
        .conf embeds the server key it was created against and is
        useless without it.

        This exists because init had no inverse. One click on the setup
        screen permanently flipped a box to "configured" — keypair
        generated, no endpoint, no peers, wg0 absent — with no route back
        short of editing the database by hand.
      responses:
        '204': { description: Removed. }
        '404': { description: Nothing to remove — not configured. }
  /vpn/config/init:
    post:
      tags: [vpn]
      summary: First-run — generate a server keypair and sensible defaults
      responses:
        '200':
          description: Newly generated config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnConfig' }
        '409': { description: Already configured. }
  /vpn/server/rotate-key:
    post:
      tags: [vpn]
      summary: Regenerate the server keypair (invalidates every peer's .conf)
      responses:
        '200':
          description: Config with the new public key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnConfig' }
  /vpn/peers:
    get:
      tags: [vpn]
      summary: List WireGuard peers
      responses:
        '200':
          description: Peers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VpnPeer' }
    post:
      tags: [vpn]
      summary: Add a peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, allowedIpsMode]
              properties:
                name: { type: string }
                allowedIpsMode: { $ref: '#/components/schemas/AllowedIpsMode' }
      responses:
        '201':
          description: One-time reveal of the new peer's private key + QR + full .conf. Never retrievable again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnPeerSecret' }
  /vpn/peers/{id}:
    delete:
      tags: [vpn]
      summary: Remove a peer
      parameters: [{ $ref: '#/components/parameters/VpnPeerId' }]
      responses:
        '204': { description: Removed. }
  /vpn/peers/{id}/toggle:
    post:
      tags: [vpn]
      summary: Suspend or resume a peer without deleting it
      parameters: [{ $ref: '#/components/parameters/VpnPeerId' }]
      responses:
        '200':
          description: The flipped peer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnPeer' }
  /vpn/peers/{id}/config:
    get:
      tags: [vpn]
      summary: Download this peer's .conf
      parameters: [{ $ref: '#/components/parameters/VpnPeerId' }]
      responses:
        '200':
          description: WireGuard client config.
          content:
            text/plain:
              schema: { type: string }
  /vpn/peers/{id}/qrcode:
    get:
      tags: [vpn]
      summary: QR code of this peer's .conf, for mobile scanning
      parameters: [{ $ref: '#/components/parameters/VpnPeerId' }]
      responses:
        '200':
          description: PNG image.
          content:
            image/png:
              schema: { type: string, format: binary }
  /vpn/openvpn/config:
    get:
      tags: [vpn]
      summary: Secondary OpenVPN server config (de-emphasised; off by default)
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenVpnConfig' }
    put:
      tags: [vpn]
      summary: Update the OpenVPN config
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenVpnConfig' }
      responses:
        '200':
          description: Updated config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenVpnConfig' }
  /vpn/openvpn/clients:
    get:
      tags: [vpn]
      summary: List OpenVPN clients
      responses:
        '200':
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OpenVpnClient' }
    post:
      tags: [vpn]
      summary: Add an OpenVPN client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: The new client plus its .ovpn text. No QR — OpenVPN gets deliberately less UI than WireGuard.
          content:
            application/json:
              schema:
                type: object
                required: [client, confText]
                properties:
                  client: { $ref: '#/components/schemas/OpenVpnClient' }
                  confText: { type: string }
  /vpn/openvpn/clients/{id}:
    delete:
      tags: [vpn]
      summary: Remove an OpenVPN client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed. }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AURORA_SESSION

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PkgName:
      name: name
      in: path
      required: true
      schema: { type: string }
    PkgNamePackage:
      name: package
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FindingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VpnPeerId:
      name: id
      in: path
      required: true
      schema: { type: string }
    BackupSourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SnapshotId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DiskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ChannelId:
      name: id
      in: path
      required: true
      schema: { type: string }
    StackId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RouteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Vhost:
      name: vhost
      in: path
      required: true
      schema: { type: string }

  schemas:
    Session:
      type: object
      required: [authenticated, username, passkeyEnrolled, tz]
      properties:
        authenticated: { type: boolean }
        username: { type: [string, 'null'] }
        passkeyEnrolled: { type: boolean }
        tz: { type: [string, 'null'] }
        role:
          description: >
            Which role the session holds. AuthController.Session has sent
            this since well before GET /auth/me was itself specified, and
            the frontend reads it to gate the /users nav entry and the
            admin-only views, so the spec was simply behind the wire.
            Nullable because an unauthenticated session has no role.
          oneOf:
            - { $ref: '#/components/schemas/UserRole' }
            - { type: 'null' }

    ChangePasswordReq:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: >
            The current password, plaintext. Verified against the stored
            bcrypt hash before anything else happens; a mismatch is a
            401. Deliberately not marked minLength: 12 because
            historically-hashed passwords may be shorter and the caller
            has to be able to type whatever they typed at onboarding.
        newPassword:
          type: string
          minLength: 12
          description: >
            The new password, plaintext. Must be at least 12 characters
            and different from the current one; UsersService applies its
            standard validate step on top (banned words, entropy shape).

    OnboardingStepId:
      type: string
      enum: [welcome, admin, domain, packages, secrets, dns, tls, review, done]
    DnsMode:
      type: string
      enum: [adguard, router, mdns]

    OnboardingDraft:
      type: object
      required: [complete, bootstrap_mode, step, admin_username, domain, enabled_packages, dns_mode]
      properties:
        complete: { type: boolean }
        bootstrap_mode: { type: boolean }
        step: { $ref: '#/components/schemas/OnboardingStepId' }
        admin_username: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        enabled_packages:
          type: array
          items: { type: string }
        dns_mode:
          oneOf:
            - { $ref: '#/components/schemas/DnsMode' }
            - { type: 'null' }
    OnboardingStatus:
      type: object
      required: [complete, bootstrap_mode, step]
      properties:
        complete: { type: boolean }
        bootstrap_mode: { type: boolean }
        step: { $ref: '#/components/schemas/OnboardingStepId' }
    OnboardingPatch:
      type: object
      properties:
        domain: { type: string }
        enabled_packages: { type: array, items: { type: string } }
        dns_mode: { $ref: '#/components/schemas/DnsMode' }
        step: { $ref: '#/components/schemas/OnboardingStepId' }
    OnboardingEnv:
      type: object
      properties:
        hostname: { type: [string, 'null'] }
        lanIp: { type: [string, 'null'] }
        distro: { type: [string, 'null'] }
        kernel: { type: [string, 'null'] }
        dockerVersion: { type: [string, 'null'] }
        cpu:
          type: [object, 'null']
          properties:
            model: { type: [string, 'null'] }
            threads: { type: integer }
            cores: { type: integer }
            sockets: { type: integer }
            mhz: { type: [number, 'null'] }
            load1: { type: [number, 'null'] }
        memory:
          type: [object, 'null']
          properties:
            MemTotal: { type: integer }
            MemAvailable: { type: integer }
            MemFree: { type: integer }
        disks:
          type: [array, 'null']
          items:
            type: object
            properties:
              device: { type: string }
              mount: { type: string }
              fstype: { type: string }
              total_bytes: { type: integer }
              free_bytes: { type: integer }
              used_bytes: { type: integer }
        gpu:
          type: [object, 'null']
          properties:
            present: { type: boolean }
            vendor: { type: [string, 'null'] }
            model: { type: [string, 'null'] }
    PlanWire:
      type: object
      required: [packages_to_enable, packages_to_disable, vhosts, ports, warnings]
      properties:
        packages_to_enable: { type: array, items: { type: string } }
        packages_to_disable: { type: array, items: { type: string } }
        vhosts: { type: array, items: { type: string } }
        ports: { type: array, items: { type: integer } }
        warnings: { type: array, items: { type: string } }
    InstallResult:
      type: object
      required: [applied, packages_to_start, packages_to_stop, host_command]
      properties:
        applied: { type: array, items: { type: string } }
        packages_to_start: { type: array, items: { type: string } }
        packages_to_stop: { type: array, items: { type: string } }
        host_command: { type: string }
    LaunchStart:
      type: object
      required: [job_id, packages, started_at]
      properties:
        job_id: { type: string }
        packages: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
    LaunchStatus:
      type: object
      required: [id, state, packages, started_at, finished_at, exit_code, failure_reason, tail]
      properties:
        id: { type: string }
        state: { type: string, enum: [running, success, failed] }
        packages: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        exit_code: { type: [integer, 'null'] }
        failure_reason: { type: [string, 'null'] }
        tail: { type: array, items: { type: string } }

    PackageCategory:
      type: string
      enum: [core, privacy, media, storage, productivity, monitoring, dev, ai, home-automation, identity, network]
    PackageSummary:
      type: object
      required: [name, category, description, enabled, running]
      properties:
        name: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/PackageCategory' }
        description: { type: string }
        enabled: { type: boolean }
        running: { type: boolean }
        requires:
          type: [object, 'null']
          additionalProperties: true
        ports:
          type: [array, 'null']
          items: { type: object, additionalProperties: true }
        dependsOn:
          type: [array, 'null']
          items: { type: string }
        # Upstream links. Not every manifest carries them yet, so both are
        # nullable and the UI renders nothing when absent.
        sourceUrl:
          type: [string, 'null']
        homepageUrl:
          type: [string, 'null']
        # Bundled-icon slug (e.g. `jellyfin`); the frontend resolves it to
        # /icons/<slug>.svg. Nullable — a manifest without one falls back to
        # a category tile, so the card never breaks on a missing logo.
        icon:
          type: [string, 'null']
        # The five fields below were served by the backend and documented
        # nowhere, so every packages response had to be stripped before it
        # could be validated. The frontend reads all of them, so the spec
        # was what was wrong. Straight off the manifest, hence the loose
        # typing on profiles.
        recommends:
          type: array
          items: { type: string }
          description: Packages this one works better with, not hard dependencies.
        profiles:
          type: object
          additionalProperties: true
          description: The manifest's `profiles:` block — optional compose profiles.
        requiredEnv:
          type: array
          items: { type: string }
          description: Env keys with no usable default; drives `required` on EnvVarSpec.
        postInstallNotes:
          type: string
          description: >
            Free text from the manifest, shown after an install. Omitted
            when the manifest declares none.
        sso:
          $ref: '#/components/schemas/PackageSsoBlock'
    PackageSsoBlock:
      type: object
      description: >
        The manifest's `sso:` block. Gates the SSO badge on the app page
        and tells CaddySnippetService whether to emit `import authelia`
        into the package's vhosts.
      required: [protect, minRole, trustedHeaders, disableEnv]
      properties:
        protect: { type: boolean }
        minRole:
          # ALL_CAPS, unlike UserRole's lowercase: this comes from the
          # domain Role enum, which has a wireName() but no @JsonValue, so
          # Jackson serialises the constant name. Documented as it is
          # rather than as it perhaps ought to be.
          type: string
          enum: [GUEST, USER, ADMIN]
        trustedHeaders: { type: boolean }
        disableEnv:
          type: array
          items: { type: string }

    EnvVarSpec:
      type: object
      required: [key, secret, required]
      properties:
        key: { type: string }
        value: { type: string }
        example: { type: string }
        comment: { type: string }
        secret: { type: boolean }
        required: { type: boolean }
    PackageDetail:
      allOf:
        - { $ref: '#/components/schemas/PackageSummary' }
        - type: object
          properties:
            readme: { type: string }
            vhosts: { type: array, items: { type: string } }
            homepageTiles: { type: integer }
            envVars: { type: array, items: { $ref: '#/components/schemas/EnvVarSpec' } }
            backup:
              oneOf:
                - { $ref: '#/components/schemas/PackageBackupSpec' }
                - { type: 'null' }
    PackageResources:
      type: object
      description: >
        Per-container ceilings for one package. A home box has no spare
        capacity and usually no swap, so one runaway container takes the
        whole machine down; a cap means the kernel kills the offender
        rather than the OOM killer choosing at random.
      required: [package, defaultMemLimitMb, defaultCpus, memLimitMb, cpus, memUsedMb, cpuPct]
      properties:
        package: { type: string }
        defaultMemLimitMb:
          type: [integer, 'null']
          description: From the manifest. Null means the package ships uncapped.
        defaultCpus: { type: [number, 'null'] }
        memLimitMb:
          type: [integer, 'null']
          description: Operator override. Null means the manifest default applies.
        cpus: { type: [number, 'null'] }
        memUsedMb: { type: [integer, 'null'] }
        cpuPct: { type: [number, 'null'] }
    PackageBackupSpec:
      type: object
      description: >
        The manifest's `backup:` block: which paths this package owns and
        what must run before they can be snapshotted consistently.
        Read-only over the API. See docs/BACKUP_PAGE_DESIGN.md §6.
      required: [paths, before]
      properties:
        paths:
          type: array
          items: { type: string }
        before:
          type: array
          items: { $ref: '#/components/schemas/BackupAction' }
    JobRef:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }

    JobKind:
      type: string
      enum: [enable, disable, stop, update, update-check, start, restart, backup, restore, parity-sync, parity-scrub, deploy]
    JobState:
      type: string
      enum: [queued, running, success, failed]
    JobFailureCode:
      type: string
      description: >
        Machine-readable failure classification. The frontend picks its
        copy from this rather than showing a raw stderr line; `unknown`
        falls back to the job's own failureReason.
      enum: [port_conflict, pull_rate_limited, registry_unreachable, disk_full, docker_down, container_crashed, unknown]
    JobSummary:
      type: object
      required: [id, kind, target, state, startedAt, finishedAt, exitCode, failureCode, failureReason]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/JobKind' }
        target:
          type: [string, 'null']
          description: Package name, snapshot id, stack name. Null for box-wide jobs.
        state: { $ref: '#/components/schemas/JobState' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        exitCode: { type: [integer, 'null'] }
        failureCode:
          oneOf:
            - { $ref: '#/components/schemas/JobFailureCode' }
            - { type: 'null' }
        failureReason: { type: [string, 'null'] }
    JobStatus:
      allOf:
        - { $ref: '#/components/schemas/JobSummary' }
        - type: object
          required: [tail]
          properties:
            tail:
              type: array
              items: { type: string }
              description: Log lines so far, oldest first. Capped server-side.

    UpdateState:
      type: string
      description: >
        `unknown` means the registry check itself failed, which is not the
        same as up to date, and the UI says so rather than showing a tick.
      enum: [current, available, unknown]
    ImageUpdate:
      type: object
      required: [image, currentTag, currentDigest, latestTag, latestDigest, pinned, state]
      properties:
        image:
          type: string
          description: Repository without the tag, e.g. "jellyfin/jellyfin".
        currentTag: { type: string }
        currentDigest: { type: [string, 'null'] }
        latestTag: { type: [string, 'null'] }
        latestDigest: { type: [string, 'null'] }
        pinned:
          type: boolean
          description: >
            Compose references this image by digest (via pins.env) rather
            than a floating tag. A pinned image can still report an
            update; it just will not move on its own.
        state: { $ref: '#/components/schemas/UpdateState' }
    PackageUpdate:
      type: object
      required: [package, state, images, lastCheckedAt, lastUpdatedAt, lastUpdateJobId, lastUpdateFailed]
      properties:
        package: { type: string }
        state: { $ref: '#/components/schemas/UpdateState' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageUpdate' }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        lastUpdatedAt: { type: [string, 'null'], format: date-time }
        lastUpdateJobId:
          type: [string, 'null']
          description: Most recent update attempt, for linking back to its log.
        lastUpdateFailed: { type: boolean }

    RepoState:
      type: string
      enum: [not-configured, connected, unreachable]
    SnapshotState:
      type: string
      enum: [ok, partial, failed]
    BackupAction:
      type: object
      description: What has to happen before a path can be snapshotted consistently.
      required: [kind, description, container]
      properties:
        kind:
          type: string
          enum: [postgres-dump, mysql-dump, sqlite-backup, command]
        description: { type: string }
        container: { type: [string, 'null'] }
    BackupStatus:
      type: object
      required: [repoState, repoKind, repoLocation, encrypted, totalSizeBytes, uniqueSizeBytes, snapshotCount, lastRunAt, lastRunState, lastRunDurationMs, nextRunAt, generatedAt]
      properties:
        repoState: { $ref: '#/components/schemas/RepoState' }
        repoKind:
          type: [string, 'null']
          description: filesystem, s3, b2, sftp… as Kopia reports it.
        repoLocation: { type: [string, 'null'] }
        encrypted: { type: boolean }
        totalSizeBytes:
          type: [integer, 'null']
          description: Logical size of everything protected.
        uniqueSizeBytes:
          type: [integer, 'null']
          description: What it occupies after dedup and compression.
        snapshotCount: { type: integer }
        lastRunAt: { type: [string, 'null'], format: date-time }
        lastRunState:
          oneOf:
            - { $ref: '#/components/schemas/SnapshotState' }
            - { type: 'null' }
        lastRunDurationMs: { type: [integer, 'null'] }
        nextRunAt: { type: [string, 'null'], format: date-time }
        generatedAt: { type: string, format: date-time }
    BackupSource:
      type: object
      required: [id, path, package, enabled, lastSnapshotAt, lastSnapshotState, sizeBytes, fileCount, beforeActions, needsConsistencyAction]
      properties:
        id: { type: string }
        path: { type: string }
        package:
          type: [string, 'null']
          description: The aurora package this path belongs to, when Aurora can tell.
        enabled: { type: boolean }
        lastSnapshotAt: { type: [string, 'null'], format: date-time }
        lastSnapshotState:
          oneOf:
            - { $ref: '#/components/schemas/SnapshotState' }
            - { type: 'null' }
        sizeBytes: { type: [integer, 'null'] }
        fileCount: { type: [integer, 'null'] }
        beforeActions:
          type: array
          items: { $ref: '#/components/schemas/BackupAction' }
        needsConsistencyAction:
          type: boolean
          description: >
            The source contains a database Aurora knows about and no
            before-action is declared for it, so the snapshot is a copy of
            a live data directory. Surfaced as a warning rather than left
            to be discovered during a restore.
    Snapshot:
      type: object
      required: [id, sourceId, path, createdAt, state, sizeBytes, fileCount, consistent]
      properties:
        id: { type: string }
        sourceId: { type: string }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/SnapshotState' }
        sizeBytes: { type: integer }
        fileCount: { type: integer }
        consistent:
          type: boolean
          description: Taken with the source's before-actions applied.
    BackupPolicy:
      type: object
      required: [scheduleCron, scheduleLabel, keepDaily, keepWeekly, keepMonthly, stalenessWarnDays]
      properties:
        scheduleCron: { type: string }
        scheduleLabel:
          type: string
          description: The cron expression in English, rendered server-side.
        keepDaily: { type: integer }
        keepWeekly: { type: integer }
        keepMonthly: { type: integer }
        stalenessWarnDays:
          type: integer
          description: Days without a successful snapshot before Aurora calls it stale.

    SmartHealth:
      type: string
      description: >
        What smartctl reports overall. Optimistic by design — a drive can
        report `passed` while steadily reallocating sectors — so the UI
        also reads the reallocated and pending counts before calling a
        disk healthy. `unknown` means the drive exposes no SMART data
        (USB enclosure, VM), which is not the same as passing.
      enum: [passed, warning, failing, unknown]
    DiskRole:
      type: string
      enum: [data, parity, system, unassigned]
    Disk:
      type: object
      required: [id, device, model, serial, sizeBytes, role, mountpoint, filesystem, usedBytes, health, temperatureC, powerOnHours, reallocatedSectors, pendingSectors, lastSelfTestAt, lastSelfTestResult]
      properties:
        id:
          type: string
          description: Stable id, by-id where available so it survives a re-cable.
        device: { type: string }
        model: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        sizeBytes: { type: integer }
        role: { $ref: '#/components/schemas/DiskRole' }
        mountpoint: { type: [string, 'null'] }
        filesystem: { type: [string, 'null'] }
        usedBytes: { type: [integer, 'null'] }
        health: { $ref: '#/components/schemas/SmartHealth' }
        temperatureC: { type: [integer, 'null'] }
        powerOnHours: { type: [integer, 'null'] }
        reallocatedSectors: { type: [integer, 'null'] }
        pendingSectors: { type: [integer, 'null'] }
        lastSelfTestAt: { type: [string, 'null'], format: date-time }
        lastSelfTestResult: { type: [string, 'null'] }
    SmartAttribute:
      type: object
      required: [id, name, value, worst, threshold, raw, failedWhen]
      properties:
        id: { type: integer }
        name: { type: string }
        value: { type: integer }
        worst: { type: integer }
        threshold: { type: integer }
        raw: { type: string }
        failedWhen: { type: [string, 'null'] }
    DiskSmart:
      type: object
      required: [diskId, supported, overall, attributes, collectedAt]
      properties:
        diskId: { type: string }
        supported: { type: boolean }
        overall: { $ref: '#/components/schemas/SmartHealth' }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/SmartAttribute' }
        collectedAt:
          # A disk with no SMART support has nothing to collect, and the
          # backend answers null rather than 404ing the whole resource.
          type: [string, 'null']
          format: date-time
    PoolBranch:
      type: object
      required: [diskId, path, totalBytes, usedBytes]
      properties:
        diskId: { type: string }
        path: { type: string }
        totalBytes: { type: integer }
        usedBytes: { type: integer }
    Pool:
      type: object
      required: [configured, mountpoint, totalBytes, usedBytes, branches, createPolicy, minFreeBytes]
      properties:
        configured:
          type: boolean
          description: False on a single-disk box, which is a valid setup rather than an error.
        mountpoint: { type: [string, 'null'] }
        totalBytes: { type: [integer, 'null'] }
        usedBytes: { type: [integer, 'null'] }
        branches:
          type: array
          items: { $ref: '#/components/schemas/PoolBranch' }
        createPolicy:
          type: [string, 'null']
          description: mergerfs create policy, e.g. 'mfs' (most free space).
        minFreeBytes:
          type: [integer, 'null']
          description: >
            mergerfs minfreespace. A branch below this has quietly stopped
            receiving new files, which a pool-wide percentage hides.
    ParityRunState:
      type: string
      description: >
        `aborted` is distinct from `failed`: the snapraid-runner refuses
        to sync when deletions exceed snapraid_delete_threshold, which is
        a deliberate guard rather than a fault. Parity is still not
        current, and it still needs a person.
      enum: [ok, failed, aborted, never]
    Parity:
      type: object
      required: [configured, parityDiskIds, lastSyncAt, lastSyncState, lastScrubAt, pendingChanges, deletedSinceSync, deletionThreshold, stalenessWarnDays]
      properties:
        configured: { type: boolean }
        parityDiskIds:
          type: array
          items: { type: string }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        lastSyncState: { $ref: '#/components/schemas/ParityRunState' }
        lastScrubAt: { type: [string, 'null'], format: date-time }
        pendingChanges:
          type: [integer, 'null']
          description: Files added or changed since the last sync, and so unprotected.
        deletedSinceSync: { type: [integer, 'null'] }
        deletionThreshold:
          type: [integer, 'null']
          description: snapraid_delete_threshold from the host role.
        stalenessWarnDays: { type: integer }

    ChannelKind:
      type: string
      enum: [ntfy, discord, webhook]
    NotifyEvent:
      type: string
      enum: [service-down, security-finding, backup-failed, backup-stale, disk-health, update-available, job-failed]
    ChannelDraft:
      type: object
      required: [kind, name, target, events]
      properties:
        kind: { $ref: '#/components/schemas/ChannelKind' }
        name: { type: string }
        target:
          type: string
          description: ntfy topic URL, Discord webhook URL, or any POST target.
        events:
          type: array
          items: { $ref: '#/components/schemas/NotifyEvent' }
    ChannelPatch:
      type: object
      description: >
        A partial update — every field optional, which is what "change a
        channel, or mute it" means. This used to be an allOf over
        ChannelDraft, so the contract demanded kind, name, target and
        events on a request whose whole point is sending one of them; the
        backend has always accepted {"enabled": false} alone.
      properties:
        kind: { $ref: '#/components/schemas/ChannelKind' }
        name: { type: string }
        target: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/NotifyEvent' }
        enabled: { type: boolean }

    NotificationChannel:
      allOf:
        - { $ref: '#/components/schemas/ChannelDraft' }
        - type: object
          required: [id, enabled, lastSentAt, lastResult, lastError]
          properties:
            id: { type: string }
            enabled: { type: boolean }
            lastSentAt: { type: [string, 'null'], format: date-time }
            lastResult: { type: [string, 'null'], enum: [ok, failed, null] }
            lastError: { type: [string, 'null'] }
    NotificationDelivery:
      type: object
      required: [id, channelId, event, subject, sentAt, result, error]
      properties:
        id: { type: string }
        channelId: { type: string }
        event: { $ref: '#/components/schemas/NotifyEvent' }
        subject: { type: string }
        sentAt: { type: string, format: date-time }
        result: { type: string, enum: [ok, failed] }
        error: { type: [string, 'null'] }

    PinningState:
      type: object
      required: [total, pinned, unpinned, pinsFileExists, generatedAt]
      properties:
        total: { type: integer }
        pinned: { type: integer }
        unpinned: { type: array, items: { type: string } }
        pinsFileExists: { type: boolean }
        generatedAt: { type: [string, 'null'], format: date-time }
    SecretsState:
      type: object
      required: [encrypted, method, envFiles, encryptedFiles]
      properties:
        encrypted: { type: boolean }
        method: { type: [string, 'null'], enum: [sops-age, null] }
        envFiles: { type: integer }
        encryptedFiles: { type: integer }
    SocketState:
      type: object
      required: [proxied, exposedContainers, writable]
      properties:
        proxied:
          type: boolean
          description: The dashboard talks to a least-privilege proxy rather than the raw socket.
        exposedContainers: { type: array, items: { type: string } }
        writable: { type: boolean }
    HardeningState:
      type: object
      required: [pinning, secrets, dockerSocket]
      properties:
        pinning: { $ref: '#/components/schemas/PinningState' }
        secrets: { $ref: '#/components/schemas/SecretsState' }
        dockerSocket: { $ref: '#/components/schemas/SocketState' }
    ImportRequest:
      type: object
      description: >
        What POST /system/import actually reads:
        SettingsPortabilityController.importSettings touches `version`,
        `enabledPackages` and `domain` and nothing else. The request used
        to be typed as SettingsExport — the export *response* schema —
        which demanded exportedAt, hostname, profiles, dnsMode and
        settings on the way in, none of which the importer looks at. A
        hand-written import file that omitted them was rejected by the
        contract and accepted by the box.
      required: [version]
      properties:
        version:
          type: integer
          description: Schema version, so a future import can migrate the file.
        domain: { type: [string, 'null'] }
        enabledPackages:
          type: array
          items: { type: string }
          description: >
            Package names. Non-string entries are filtered out rather than
            rejected, so a hand-edited file with a stray null still
            imports — but the contract is strings.

    SettingsExport:
      type: object
      required: [version, exportedAt, hostname, domain, enabledPackages, profiles, dnsMode, settings]
      properties:
        version:
          type: integer
          description: Schema version, so a future import can migrate it.
        exportedAt: { type: string, format: date-time }
        hostname: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        enabledPackages: { type: array, items: { type: string } }
        profiles: { type: array, items: { type: string } }
        dnsMode: { type: [string, 'null'] }
        settings:
          type: object
          additionalProperties: true
          description: Non-secret preferences — notification channels, backup policy, edge protection, custom routes.
    ImportResult:
      type: object
      required: [applied, skipped, preview]
      properties:
        applied: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: string } }
        preview: { type: boolean }
    StackState:
      type: string
      enum: [draft, running, stopped, failed]
    IssueKind:
      type: string
      description: >
        The first five block a deploy; the rest are advisory and state a
        consequence rather than refusing. The advisory list is the point
        of the screen — anyone pasting a compose file from a forum post
        is, statistically, pasting all of them.
      enum: [parse-error, no-services, port-conflict, name-conflict, privileged-port, unpinned-image, privileged, docker-socket, host-network, no-restart-policy, uncapped]
    StackIssue:
      type: object
      required: [kind, message, service]
      properties:
        kind: { $ref: '#/components/schemas/IssueKind' }
        message: { type: string }
        service: { type: [string, 'null'] }
    StackValidation:
      type: object
      required: [valid, errors, warnings, services, ports, images, volumes]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/StackIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/StackIssue' }
        services: { type: array, items: { type: string } }
        ports: { type: array, items: { type: integer } }
        images: { type: array, items: { type: string } }
        volumes: { type: array, items: { type: string } }
    CustomStack:
      type: object
      required: [id, name, state, composeYaml, createdAt, lastDeployedAt, lastJobId, containers]
      properties:
        id: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/StackState' }
        composeYaml: { type: string }
        createdAt: { type: string, format: date-time }
        lastDeployedAt: { type: [string, 'null'], format: date-time }
        lastJobId: { type: [string, 'null'] }
        containers: { type: array, items: { type: string } }
    ProxyRoute:
      type: object
      required: [id, subdomain, vhost, target, managed, package, createdAt]
      properties:
        id: { type: string }
        subdomain:
          type: string
          description: Label only — "photos" becomes photos.aurora.local.
        vhost: { type: string }
        target:
          type: string
          description: Where Caddy forwards to, as container:port.
        managed:
          type: boolean
          description: >
            Generated from a package manifest, so read-only here.
            Changing it means changing the package.
        package: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
    ProxyTarget:
      type: object
      required: [container, ports, package]
      properties:
        container: { type: string }
        ports:
          type: array
          items: { type: integer }
        package: { type: [string, 'null'] }
    ConflictKind:
      type: string
      enum: [vhost-taken, mdns-alias, reserved, target-unreachable]
    ProxyConflict:
      type: object
      required: [kind, message, advisory]
      properties:
        kind: { $ref: '#/components/schemas/ConflictKind' }
        message: { type: string }
        advisory:
          type: boolean
          description: Worth saying, but not a reason to refuse.
    ProxyPreview:
      type: object
      required: [vhost, snippet, conflicts]
      properties:
        vhost: { type: string }
        snippet:
          type: string
          description: Exactly what would be appended to caddy.snippet.
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/ProxyConflict' }
    EgressMode:
      type: string
      enum: [direct, vpn]
    PackageNetwork:
      type: object
      required: [package, mode, gateway, locked, lockedReason, containers, publishedPorts, egressIp, egressCountry, gatewayHealthy]
      properties:
        package: { type: string }
        mode: { $ref: '#/components/schemas/EgressMode' }
        gateway:
          type: [string, 'null']
          description: Gateway container whose network namespace this app would share.
        locked: { type: boolean }
        lockedReason: { type: [string, 'null'] }
        containers:
          type: array
          items: { type: string }
          description: Containers that restart when the mode changes.
        publishedPorts:
          type: array
          items: { type: integer }
          description: >
            Host ports this app publishes. A namespaced app cannot publish
            its own ports, so these move onto the gateway when tunnelled.
        egressIp: { type: [string, 'null'] }
        egressCountry: { type: [string, 'null'] }
        gatewayHealthy:
          type: boolean
          description: >
            A tunnelled app has no network at all while the gateway is
            down. That is the kill switch, and it is deliberate.
    RateLimit:
      type: object
      required: [enabled, requestsPerMinute]
      properties:
        enabled: { type: boolean }
        requestsPerMinute: { type: integer }
    GeoBlock:
      type: object
      required: [enabled, allowCountries]
      properties:
        enabled: { type: boolean }
        allowCountries:
          type: array
          items: { type: string }
          description: ISO-3166 alpha-2 allow-list. Empty with enabled true blocks everything.
    VhostProtection:
      type: object
      required: [vhost, package, publiclyResolvable, authelia, rateLimit, geoBlock, botDetection, blocked24h, lastBlockedAt]
      properties:
        vhost: { type: string }
        package: { type: string }
        publiclyResolvable:
          type: boolean
          description: >
            Resolves from outside the LAN. Protection defaults on for
            these and stays off for LAN-only names, because rate-limiting
            your own laptop is pure downside.
        authelia: { type: boolean }
        rateLimit: { $ref: '#/components/schemas/RateLimit' }
        geoBlock: { $ref: '#/components/schemas/GeoBlock' }
        botDetection: { type: boolean }
        blocked24h: { type: integer }
        lastBlockedAt: { type: [string, 'null'], format: date-time }

    ServiceState:
      type: string
      enum: [running, needs-config, failed, not-started, starting]
    ServiceStatus:
      type: object
      required: [package, container, state, reason, detail, open_url, priority, probed_ms]
      properties:
        package: { type: string }
        container: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ServiceState' }
        reason: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        open_url: { type: [string, 'null'] }
        priority: { type: integer }
        probed_ms: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatus' }
    ServicesStatusResponse:
      type: object
      required: [generated_at, services]
      properties:
        generated_at: { type: string, format: date-time }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatus' }
    ServiceStartResponse:
      type: object
      required: [job_id, packages, started_at]
      properties:
        job_id: { type: string }
        packages: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }

    ContainerInfo:
      type: object
      required: [id, names, image, state, status, service, labels]
      properties:
        id: { type: string }
        names: { type: array, items: { type: string } }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        service: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
    ContainerEventItem:
      type: object
      required: [ts, container, action]
      properties:
        ts: { type: integer, description: Unix milliseconds. }
        container: { type: string }
        action: { type: string }
        image: { type: string }
    ContainerLogLine:
      type: object
      required: [stream, line]
      properties:
        ts: { type: string }
        stream: { type: string, enum: [stdout, stderr] }
        line: { type: string }
    ContainerLogsResponse:
      type: object
      required: [container_id, tail, truncated, lines]
      properties:
        container_id: { type: string }
        tail: { type: integer }
        truncated: { type: boolean }
        lines: { type: array, items: { $ref: '#/components/schemas/ContainerLogLine' } }

    MetricBucket:
      type: object
      required: [ts, avg, min, max, count]
      properties:
        ts: { type: integer, description: Bucket start, unix ms. }
        avg: { type: number }
        min: { type: number }
        max: { type: number }
        count: { type: integer }

    SecurityFinding:
      type: object
      required: [id, severity, title, description, remediationUrl]
      properties:
        id: { type: string }
        severity: { type: string, description: 'high | medium | low, extensible.' }
        title: { type: string }
        description: { type: string }
        remediationUrl: { type: [string, 'null'] }
    DismissalRow:
      type: object
      required: [finding_id, dismissed_at, expires_at, reason]
      properties:
        finding_id: { type: string }
        dismissed_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }

    AuditEvent:
      type: object
      required: [id, ts, user_id, action, target, diff_json]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        user_id: { type: [integer, 'null'] }
        action: { type: string }
        target: { type: [string, 'null'] }
        diff_json: { type: [string, 'null'] }

    SystemCapabilities:
      type: object
      required: [metrics]
      properties:
        metrics: { type: boolean }
        securityScanner: { type: boolean }
        backup:
          type: boolean
          description: >
            Gates /backup. False until the backend can talk to Kopia's
            server API; while false the nav entry hides.
        disks:
          type: boolean
          description: >
            Gates /disks. False until the backend can read smartctl and
            the mergerfs/snapraid state.
    SystemInfo:
      type: object
      required: [capabilities]
      properties:
        hostname: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        lanIp: { type: [string, 'null'] }
        distro: { type: [string, 'null'] }
        kernel: { type: [string, 'null'] }
        uptimeSeconds: { type: [integer, 'null'] }
        cpuCount: { type: [integer, 'null'] }
        memTotalBytes: { type: [integer, 'null'] }
        memUsedBytes: { type: [integer, 'null'] }
        diskTotalBytes: { type: [integer, 'null'] }
        diskUsedBytes: { type: [integer, 'null'] }
        dockerVersion: { type: [string, 'null'] }
        containerCount: { type: [integer, 'null'] }
        capabilities: { $ref: '#/components/schemas/SystemCapabilities' }
    MetricSample:
      type: object
      required: [ts, cpuPct, memPct, diskPct, containers]
      properties:
        ts: { type: integer }
        cpuPct: { type: number }
        memPct: { type: number }
        diskPct: { type: number }
        containers: { type: integer }
    StateFile:
      type: object
      required: [enabled, profiles]
      properties:
        bootstrapVersion: { type: [integer, 'null'] }
        hostname: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        installedAt: { type: [string, 'null'], format: date-time }
        enabled: { type: array, items: { type: string } }
        profiles: { type: array, items: { type: string } }

    AliasState:
      type: string
      enum: [up, failed, starting]
    AliasSource:
      type: string
      enum: [manifest, caddy, unknown]
    MdnsAlias:
      type: object
      required: [alias, label, pkg, source, state, targetIp, publishedAt, error]
      properties:
        alias: { type: string }
        label: { type: string }
        pkg: { type: string }
        source: { $ref: '#/components/schemas/AliasSource' }
        state: { $ref: '#/components/schemas/AliasState' }
        targetIp: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
    MdnsAliasPayload:
      type: object
      required: [aliases, total, up, failed]
      properties:
        aliases: { type: array, items: { $ref: '#/components/schemas/MdnsAlias' } }
        total: { type: integer }
        up: { type: integer }
        failed: { type: integer }

    VpnRunState:
      type: string
      enum: [running, stopped, degraded, not-configured]
    AllowedIpsMode:
      type: string
      description: >
        'split' (default) pushes only the LAN + tunnel subnets to the
        peer — remote access to this network only. 'full' pushes
        0.0.0.0/0 + ::/0 and marks the peer killSwitch: true, routing
        every bit of the peer's traffic through this box.
      enum: [split, full]
    VpnStatus:
      type: object
      required: [runState, interface, listenPort, endpoint, peersTotal, peersOnline, reachable, lastCheckedAt, generatedAt]
      properties:
        runState: { $ref: '#/components/schemas/VpnRunState' }
        interface: { type: [string, 'null'], description: 'e.g. "wg0"; null while not-configured.' }
        listenPort: { type: [integer, 'null'] }
        endpoint: { type: [string, 'null'], description: 'host:port once known.' }
        peersTotal: { type: integer }
        peersOnline: { type: integer, description: Handshake within the last 3 minutes. }
        reachable:
          type: [boolean, 'null']
          description: null = not checked yet; the backend probes an external service to confirm the port is actually forwarded.
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        generatedAt: { type: string, format: date-time }
    VpnConfig:
      type: object
      required: [endpointHost, listenPort, dns, serverAddress, mtu, serverPublicKey]
      properties:
        endpointHost: { type: string, description: "DDNS name or public IP; may be '' before first fill-in." }
        listenPort: { type: integer, description: Default 51820. }
        dns: { type: string, description: Pushed to peers. Defaults to Privacy's AdGuard LAN IP if enabled, else a public resolver. }
        serverAddress: { type: string, description: 'Tunnel subnet, e.g. "10.66.66.1/24".' }
        mtu: { type: integer, description: Default 1420. }
        serverPublicKey: { type: [string, 'null'], description: null until POST /vpn/config/init has run once. }
    VpnPeer:
      type: object
      required: [id, name, publicKey, allowedIps, killSwitch, enabled, lastHandshakeAt, rxBytes, txBytes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        publicKey: { type: string }
        allowedIps: { type: string, description: What's actually pushed to this peer's client routing table. }
        killSwitch: { type: boolean, description: 'true when this peer was created with allowedIpsMode: full.' }
        enabled: { type: boolean }
        lastHandshakeAt: { type: [string, 'null'], format: date-time }
        rxBytes: { type: integer }
        txBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    VpnPeerSecret:
      type: object
      required: [peer, privateKey, qrPngBase64, confText]
      description: >
        Returned exactly once, from POST /vpn/peers. The private key is
        never retrievable again — there is no reveal=1 for a WireGuard
        key the way there is for a package env secret. Losing it means
        removing the peer and adding a new one.
      properties:
        peer: { $ref: '#/components/schemas/VpnPeer' }
        privateKey: { type: string }
        qrPngBase64: { type: string }
        confText: { type: string }
    OpenVpnConfig:
      type: object
      required: [enabled, port, protocol]
      properties:
        enabled: { type: boolean, description: Off by default — WireGuard above is the recommended path. }
        port: { type: integer, description: Default 1194. }
        protocol: { type: string, enum: [udp, tcp] }
    OpenVpnClient:
      type: object
      required: [id, name, createdAt, lastConnectedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastConnectedAt: { type: [string, 'null'], format: date-time }

    UserRole:
      type: string
      description: >
        Phase D's vocabulary. `user` is a regular authenticated identity
        and `guest` is read-mostly; the DDL default is `user` so a caller
        that forgets to specify a role cannot accidentally create an
        admin. Enforced by SQLite triggers, not just application code.
      enum: [admin, user, guest]
    User:
      type: object
      required: [id, username, role, tz, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        tz: { type: string }
        createdAt: { type: string, format: date-time }

    CreatedUser:
      type: object
      required: [user, generatedPassword]
      properties:
        user: { $ref: '#/components/schemas/User' }
        generatedPassword:
          type: string
          nullable: true
          description: >-
            Non-null only when Aurora generated the password. Returned once
            and stored nowhere, so a lost value means a reset, not a lookup.
            Null when the caller supplied their own -- we never echo back a
            secret the client already holds.

    GeneratedPassword:
      type: object
      required: [password, generated]
      properties:
        password:
          type: string
          nullable: true
          description: Null when the caller supplied the password.
        generated:
          type: boolean
          description: Whether Aurora chose the password.

    SsoEnrollment:
      type: object
      required: [enrolled, factorCount, passkeyCount, pendingUrl, pendingAt, autheliaUp]
      properties:
        enrolled:
          type: boolean
          description: At least one usable second factor (WebAuthn or TOTP) is registered.
        factorCount: { type: integer }
        passkeyCount:
          type: integer
          description: WebAuthn credentials specifically, so the UI can say "passkey".
        pendingUrl:
          type: string
          nullable: true
          description: >-
            Most recent registration link Authelia emitted to its filesystem
            notifier. Null when none is pending, or when withheld because
            onboarding is already complete.
        pendingAt:
          type: string
          nullable: true
          format: date-time
        autheliaUp:
          type: boolean
          description: False when Authelia's database could not be read -- not yet started.

    SsoNotification:
      type: object
      required: [date, recipient, subject, otp, urls, body]
      properties:
        date:
          type: string
          description: >-
            Authelia-formatted timestamp, verbatim. Kept as a string
            because Authelia's format has drifted across releases and
            parsing it strictly would break the panel on upgrade; the UI
            formats it client-side.
        recipient:
          type: string
          description: >-
            The {Name email} bracket Authelia writes, verbatim. Preserved
            unparsed so a future field addition is not silently dropped.
        subject:
          type: string
        otp:
          type: string
          nullable: true
          description: >-
            One-time code when the notification contains one; null for
            enrollment links, password-reset links, or any notification
            that carries no lone alphanumeric token.
        urls:
          type: array
          items: { type: string }
          description: Every URL in the body, in document order.
        body:
          type: string
          description: >-
            Notification message body with the Date/Recipient/Subject
            headers stripped so the raw-details view does not repeat
            what the structured fields already show.
