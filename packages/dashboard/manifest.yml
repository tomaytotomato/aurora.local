name: dashboard
title: Aurora — admin dashboard
description: |
  Aurora is the dashboard for aurora.local. Vue 3.5 + Spring Boot 4,
  ships as a single container, served at the apex domain. Package
  picker, health, security posture, first-run wizard, per-package
  .env editor — install, configure, audit, and troubleshoot from one
  place.

category: core

depends_on:
  - core
recommends: []

ports:
  - {port: 8090, proto: tcp, description: Aurora dashboard HTTP}

requires:
  min_ram_mb: 512
  min_disk_gb: 1
  host_roles: []

required_env:
  - AURORA_SESSION_SECRET

# B1-style self probe (see packages/core/manifest.yml and
# PackagesService's "probe.kind == self" handling): if this package is
# answering the request at all, it is definitionally running. Without
# this, StatusProbeService falls back to kind: docker with container
# defaulting to the package name "dashboard" — but the actual container
# is named "aurora" (packages/dashboard/compose.yml, container_name:
# aurora), so the lookup always came up empty and the Done page's
# checklist reported the dashboard itself as "Not started" with a
# "Start" button, on the very screen it was serving. Fixed by asking the
# one question that's always true instead of a docker lookup that can
# only ever be wrong for this specific package.
probe:
  kind: self
  container: aurora
  external_url: http://{domain}/

post_install_notes: |
  1. Open the first-run wizard: https://$DOMAIN/
  2. Create the admin user (password for v0.1; passkey coming in v0.2).
  3. Onboarding wizard walks you through domain, DNS and TLS, then
     drops you on the dashboard where you install packages.
  4. SSO (Authelia) ships in core and runs from Day 0. The Aurora admin
     plane keeps its own login and is deliberately NOT behind Authelia
     forward-auth (so you can never be locked out of the control plane);
     Authelia gates the other `*.$DOMAIN` service subdomains.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/tomaytotomato/aurora.local
