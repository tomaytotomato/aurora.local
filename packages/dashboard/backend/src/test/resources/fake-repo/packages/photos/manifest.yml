# Mirrors the real packages/photos manifest: a path this package owns
# plus the dump that has to run before it can be snapshotted safely.
backup:
  paths:
    - data/photos/library
  before:
    - kind: postgres-dump
      container: immich-postgres
      description: Dumps the Immich database so the snapshot restores cleanly
