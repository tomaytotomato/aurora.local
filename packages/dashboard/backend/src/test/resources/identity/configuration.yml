###############################################################
# Authelia configuration for aurora.local                     #
#                                                             #
# Bind-mounted read-only into the container at                #
#   /config/configuration.yml                                 #
# Secrets arrive via env vars (AUTHELIA_JWT_SECRET etc.)      #
# — Authelia auto-detects them via its documented env-var-    #
# secret convention.                                          #
#                                                             #
# Phase D (Aurora dashboard) manages the users_database.yml   #
# file — see AutheliaService. Do NOT hand-edit that file, it  #
# is regenerated on every user change in Aurora + every 5 min #
# as a drift guard.                                           #
###############################################################

theme: auto

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

# ---- Identity validation (Authelia 4.38+ requires this) ------
# Signs reset / enrollment tokens. Reuses the JWT secret; the two
# subject slots key off different intents so a leaked reset link
# can't be replayed as a session cookie.
identity_validation:
  reset_password:
    jwt_lifespan: 5m
    jwt_algorithm: HS256
    jwt_secret: '{{ env "AUTHELIA_JWT_SECRET" }}'

# ---- Authentication backend ----------------------------------
# File-based. users_database.yml is projected from Aurora's users
# table (see com.tomaytotomato.aurora.services.AutheliaService).
# `watch: true` reloads on rename; Aurora's projector uses an atomic
# rename so the watcher never sees a half-written file.
authentication_backend:
  password_reset:
    disable: false
  refresh_interval: 5m
  file:
    path: /data/users_database.yml
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# ---- Access control ------------------------------------------
# Policies:
#   bypass     — no auth checked (Authelia is out of the request path).
#   one_factor — username + password.
#   two_factor — also require TOTP or WebAuthn.
#
# Group cascade (Aurora → Authelia):
#   Aurora role ADMIN → Authelia groups [admins, users, guests]
#   Aurora role USER  → Authelia groups [users, guests]
#   Aurora role GUEST → Authelia groups [guests]
# So `subject: 'group:users'` in a rule below means
# "authenticated as USER or above" — see AutheliaService.groupsFor().
#
# The base rules here handle the two identities Aurora and Authelia
# both own (auth.DOMAIN and DOMAIN itself). Per-package rules for
# min_role gating are emitted by the Caddy snippet renderer (D6):
# each protected vhost imports `authelia`, and Caddy uses a matcher
# on the Remote-Groups response header to enforce the min_role.
access_control:
  default_policy: deny
  rules:
    # Authelia's own login portal. Bypass so the sign-in page is
    # reachable even when the user has no valid session.
    - domain: 'auth.{{ env "DOMAIN" }}'
      policy: bypass

    # Apex domain — Aurora dashboard. Aurora runs its own
    # username+password flow with server-side sessions, so we
    # bypass Authelia here. Otherwise the two auth systems would
    # fight each other on every request to /.
    - domain: '{{ env "DOMAIN" }}'
      policy: bypass

    # Default for every *.DOMAIN subdomain: require 2FA. Package
    # manifests that want a laxer policy override via the sso.min_role
    # field (which the Caddy snippet renderer translates to a
    # `Remote-Groups` matcher — see D6). Anyone hitting an unmapped
    # subdomain is denied, per default_policy above.
    - domain: '*.{{ env "DOMAIN" }}'
      policy: two_factor

# ---- Session / cookies ---------------------------------------
# Cookie domain matches the RFC 6265 rule "cookies scoped to the
# apex are sent for every subdomain" — so `authelia_session` set at
# aurora.local flows to notes.aurora.local, grafana.aurora.local, …
# without any explicit per-vhost config. That's what makes SSO
# federated across the whole family.
session:
  name: authelia_session
  same_site: lax
  inactivity: 15m
  expiration: 8h
  remember_me: 1M
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://{{ env "DOMAIN" }}'

# ---- Regulation (brute-force protection) ---------------------
# Three wrong passwords → 5-minute ban. Applies per-username. Not a
# rate limit on Authelia itself; Caddy fronts the health probe and
# absorbs generic HTTP flooding.
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

# ---- Storage -------------------------------------------------
# Local SQLite. Encrypted at rest with AUTHELIA_STORAGE_ENCRYPTION_KEY
# (managed by IdentitySecretsService — see D3).
storage:
  local:
    path: /data/db.sqlite3

# ---- Notifier ------------------------------------------------
# If AUTHELIA_NOTIFIER_SMTP_HOST is set in env, Authelia auto-picks
# SMTP; otherwise it falls through to the filesystem notifier for
# a self-contained local-only setup. In filesystem mode the 2FA-
# enrolment / password-reset links land in
#   data/identity/authelia/notification.txt
# on the host, so a single-user setup can bootstrap without email.
notifier:
  disable_startup_check: false
  filesystem:
    filename: /data/notification.txt

# ---- TOTP defaults -------------------------------------------
# 6-digit code, 30-second period, one-code drift window. Matches
# every mainstream authenticator app (Google / Aegis / 1Password).
totp:
  issuer: 'Aurora ({{ env "DOMAIN" }})'
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1

# ---- WebAuthn / passkeys -------------------------------------
# Passkeys are the recommended second factor over TOTP: no shared
# secret to leak, phishing-resistant, works with hardware keys +
# macOS/iOS/Android platform authenticators.
webauthn:
  disable: false
  display_name: 'Aurora ({{ env "DOMAIN" }})'
  attestation_conveyance_preference: indirect
  timeout: 60s
