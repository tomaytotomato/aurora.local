# Minimal .state.yml the E2E reset script seeds into the isolated instance's
# repo scratch dir. Represents a "brand new box, no onboarding yet" state
# but with a plausible enabled[] set so /onboarding/done can render the
# iter-2 living checklist against real backend probes.
bootstrap_version: 1
hostname: aurora-e2e
domain: aurora-e2e.local
enabled:
  - core
  - privacy
  - media
  - storage
profiles: []
