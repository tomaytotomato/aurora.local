# aurora.local / packages/dashboard
#
# Aurora — the admin plane for an aurora.local box.
# Single container, Spring Boot 4 + embedded Vue SPA on :8090,
# fronted by Caddy at admin.$DOMAIN.

name: aurora-dashboard

networks:
  aurora_net:
    external: true

volumes:
  aurora_data: {}

services:
  aurora:
    build:
      args:
        # Stamped into the image so the box can say which build it runs.
        # Defaults keep a bare `docker compose build` working; up.sh fills
        # them in from git.
        AURORA_BUILD_REVISION: ${AURORA_BUILD_REVISION:-unknown}
        AURORA_BUILD_DATE: ${AURORA_BUILD_DATE:-unknown}
        AURORA_BUILD_VERSION: ${AURORA_VERSION:-0.1.0}
      # Not "." — up.sh invokes compose with several -f files, and compose
      # resolves relative paths against the first one's directory, not each
      # file's own. A bare "." therefore pointed at whichever package sorted
      # first and the build failed with an empty context. "../dashboard" is
      # level-invariant from any packages/*/ directory, the same trick the
      # ../../data volume paths already rely on.
      context: ../dashboard
      dockerfile: Dockerfile
    image: ghcr.io/tomaytotomato/aurora:${AURORA_VERSION:-0.1.0}
    # `missing`: use a locally-built image if one is present, otherwise pull
    # the published image from GHCR. A released box has never built locally,
    # so up.sh's `docker compose pull` fetches the published tag; dev, e2e
    # and the Lima testbed build from the `build:` block above via
    # `docker compose build` / `up --build`, and that local image is then
    # used in place of a pull. The pinned tag comes from AURORA_VERSION
    # (packages/dashboard/.env, default 0.1.0), so the box only moves when
    # that value is deliberately bumped — cut a matching vX.Y.Z release tag.
    pull_policy: missing
    container_name: aurora
    restart: unless-stopped
    networks: [aurora_net]

    # Publish for browser reach until Caddy fronts it. Bound to all
    # interfaces so the LAN can hit http://<host-lan-ip>:8090 during
    # the wizard walk-through. Caddy on :80/:443 remains the intended
    # production entry point.
    ports:
      - "${AURORA_HOST_PORT:-8090}:8090"

    # Runs as the invoking user + docker group so it can read/write
    # ~/aurora.local and talk to docker.sock. DOCKER_GID exported by
    # scripts/up.sh.
    user: "${AURORA_UID:-1000}:${DOCKER_GID:-999}"

    # AppArmor: opt aurora out of the default docker profile so it can talk
    # to the host's D-Bus system socket (mounted below). The default
    # profile explicitly denies dbus_method_call to org.freedesktop.DBus,
    # which blocks avahi-publish's initial Hello and every alias register
    # attempt. We already mount docker.sock + repo-root + host-/proc rw,
    # so aurora's security posture already assumes a trusted operator on
    # their own box — unconfined AppArmor doesn't hand it new capabilities
    # it didn't already have via those mounts. Follow-up: ship a purpose
    # AppArmor profile that unlocks only D-Bus + docker.sock and keeps
    # everything else confined. See MdnsAliasService header.
    security_opt:
      - apparmor=unconfined

    environment:
      TZ: ${TZ:-UTC}
      AURORA_DB_PATH: /data/aurora.db
      # Same-absolute-path contract: aurora sees the repo at the exact
      # host path so relative bind mounts in downstream compose files
      # (e.g. packages/core/compose.yml's ./caddy/Caddyfile) resolve
      # identically host-side when we shell out to docker compose via
      # the host socket. Bootstrap.sh sets AURORA_REPO_PATH_HOST at
      # install time; falls back to $HOME/aurora.local for dev.
      AURORA_REPO_PATH: ${AURORA_REPO_PATH_HOST:-${HOME}/aurora.local}
      AURORA_HOST_PROC: /host/proc
      DOCKER_HOST: unix:///var/run/docker.sock
      SERVER_PORT: 8090
      # Sessions / bootstrap — overridden by packages/dashboard/.env
      AURORA_SESSION_SECRET: ${AURORA_SESSION_SECRET:?set in packages/dashboard/.env}

    volumes:
      # Whole repo bind-mounted rw — aurora reads manifests + writes .env / .state.yml.
      # Mounted at the *host* path (not /repo) so any downstream `docker compose`
      # invocation from inside aurora resolves relative bind mounts against a
      # path the host daemon can also see. See AURORA_REPO_PATH above.
      - ${AURORA_REPO_PATH_HOST:-${HOME}/aurora.local}:${AURORA_REPO_PATH_HOST:-${HOME}/aurora.local}:rw
      # Docker socket for docker-java (list containers, events, stats).
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Host /proc for cheap metrics (mem, load, uptime).
      - /proc:/host/proc:ro
      # Host distro identity for the onboarding welcome screen.
      - /etc/os-release:/host/etc/os-release:ro
      # Host root, read-only. Enables statvfs on real block-device mounts
      # so the onboarding welcome + posture engine can report disk sizes.
      # Read-only + aurora runs as UID 1000, so file perms still apply.
      - /:/host_root:ro
      # Host D-Bus system socket — lets in-container avahi-publish (from the
      # avahi-tools alpine package) reach the host's avahi-daemon so
      # MdnsAliasService can register per-vhost aliases (notes.aurora.local,
      # code.aurora.local, …). Read-write because D-Bus is bi-directional.
      # Missing on hosts without avahi — MdnsAliasService detects that and
      # marks aliases failed rather than crash-looping.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:rw
      # /etc/machine-id + /var/lib/dbus/machine-id — required by libdbus SASL
      # EXTERNAL authentication. Without one of these, avahi-publish fails
      # with a misleading 'Access denied' at connection time, even though
      # the D-Bus policy would otherwise accept the caller. Mounting the
      # host's makes the container's D-Bus identity the same as the host
      # (which is semantically correct — we're publishing on the host's
      # behalf).
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
      # Aurora's own state (SQLite DB, sessions).
      - aurora_data:/data

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
