name: photos
title: Photos (Immich)
description: |
  Self-hosted photo & video backup with mobile apps, timeline, faces,
  and search. Immich server + microservices + Postgres (pgvecto.rs) +
  Redis + a machine-learning worker for CLIP / face detection.

category: productivity

depends_on:
  - core
recommends:
  - storage

profiles: {}

ports:
  - {port: 2283, proto: tcp, description: Immich web + API}

requires:
  min_ram_mb: 4096
  min_disk_gb: 20            # metadata + ML cache; library grows separately
  host_roles: []
  # A8 (iter-7): immich stack (server, machine-learning, postgres,
  # redis, proxy). ML model warm-up dominates first boot; 120s covers
  # warm relaunch. Cold-cache first launch relies on pull step.
  start_budget_seconds: 120

# Immich's machine-learning container loads a model per job and its
# memory use is spiky rather than steady. Capped so a large import
# cannot starve everything else on the box.
resources:
  mem_limit_mb: 6144
  cpus: 3.0

# Immich keeps its Postgres under this path. A copy taken while the
# server is writing is not a restorable backup, hence the dump first.
backup:
  paths:
    - data/photos/library
  before:
    - kind: postgres-dump
      container: immich-postgres
      description: Dumps the Immich database so the snapshot restores cleanly

required_env:
  - DB_PASSWORD
  - JWT_SECRET
  - UPLOAD_LOCATION

warnings:
  # Disk pressure is covered by the aggregate resource-budget warning
  # (requires.min_disk_gb feeds into it), so no per-manifest disk predicate
  # here — it would double-fire alongside the budget message.
  - id: photos_low_ram
    if: { ram_below_mb: 4096 }
    message: 'Immich (server + microservices + Postgres + Redis + ML worker) is happier with 4+ GB RAM.'

post_install_notes: |
  1. First-run: visit https://photos.$DOMAIN/ and create the admin
     user (first registered user is admin).
  2. Install the Immich mobile app (iOS/Android) and point it at the
     same URL to enable auto-backup.
  3. UPLOAD_LOCATION defaults to ../../data/photos/library — override
     in .env to point at bulk storage if you don't want your photos on
     the OS disk.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/immich-app/immich
homepage_url: https://immich.app
