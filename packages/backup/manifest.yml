name: backup
title: Backup (Kopia)
description: |
  Keeps encrypted, deduplicated copies of what matters on this box, so a
  broken drive or a bad afternoon is recoverable. Backs up to this machine by
  default; can also send copies off-site to cloud storage.
category: backup
icon: kopia

depends_on:
  - core
recommends: []
profiles: {}

ports:
  - {port: 51515, proto: tcp, description: Kopia server UI/API}

# The compose service is called `kopia` (see compose.yml); the package
# is called `backup`. Without an explicit override,
# StatusProbeService would look up a container called `backup`, never
# find it, and permanently report the package as "not started" —
# which then bubbled into a hero pill that lied about the health of
# the box. Same convention every other package uses when its service
# name differs from its package name.
probe:
  container: kopia

requires:
  min_ram_mb: 512
  min_disk_gb: 20
  host_roles: []

required_env:
  - KOPIA_PASSWORD
  - KOPIA_UI_PASSWORD

warnings:
  - id: backup_low_disk
    if: { free_disk_gb_below: 30 }
    message: 'Kopia local-filesystem repositories dedupe well but still need headroom. Less than 30 GB free on the largest drive will limit retention.'

post_install_notes: |
  UI: https://backup.$DOMAIN/  (login KOPIA_UI_USER / KOPIA_UI_PASSWORD)

  First-run:
    1. Open the UI; if the repo is uninitialised, "Create Repository"
       -> Filesystem -> /repository, encryption password = KOPIA_PASSWORD.
    2. Add sources: /data/home/<you>/aurora.local, /data/etc, etc.
    3. Import policies/default-policy.json as a starting point.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/kopia/kopia
homepage_url: https://kopia.io
