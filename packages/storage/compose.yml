# aurora.local / packages/storage
#
# LAN file sharing. Samba exports the media root over SMB. MiniDLNA
# advertises the same content over UPnP/DLNA for smart TVs that
# don't speak SMB.

name: aurora-storage

networks:
  aurora_net:
    external: true

services:
  samba:
    image: dperson/samba:latest
    container_name: samba
    restart: unless-stopped
    networks: [aurora_net]
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=${TZ:-Europe/London}
      - USERID=1000
      - GROUPID=1000
    # Args passed to the entrypoint. Each -s adds a share.
    #   -s "name;path;browsable;readonly;guest;users;admins;writelist;comment"
    command: >-
      -u "${SAMBA_USER:-bruce};${SAMBA_PASS:-changeme}"
      -s "media;/media;yes;no;no;${SAMBA_USER:-bruce}"
    volumes:
      - /home/bruce/media:/media

  minidlna:
    image: vladgh/minidlna:latest
    container_name: minidlna
    restart: unless-stopped
    network_mode: host
    environment:
      - MINIDLNA_MEDIA_DIR=/media
      - MINIDLNA_FRIENDLY_NAME=aurora.local
    volumes:
      - /home/bruce/media:/media:ro
      - ../../data/minidlna:/minidlna
