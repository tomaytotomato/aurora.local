name: storage
title: LAN file sharing (SMB + DLNA)
description: |
  Shares this box's files with the whole house: appears as a network drive on
  computers and phones, and as a media source on smart TVs.
category: storage

depends_on:
  - core
recommends: []
profiles: {}

ports:
  - {port: 445,  proto: tcp, description: Samba SMB}
  - {port: 8200, proto: tcp, description: MiniDLNA HTTP/UPnP}
  - {port: 1900, proto: udp, description: MiniDLNA SSDP}

requires:
  min_ram_mb: 256
  min_disk_gb: 1
  host_roles: []

required_env: []

probe:
  kind: smb
  container: samba
  port: 445
  external_url: smb://{lan_ip}/

post_install_notes: |
  The "media" share is read-write and requires the SAMBA_USER/SAMBA_PASS
  credentials set in packages/storage/.env — it is not served as guest.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/samba-team/samba
homepage_url: https://www.samba.org
