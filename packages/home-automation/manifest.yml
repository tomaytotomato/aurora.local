name: home-automation
title: Home automation (Home Assistant + MQTT + Zigbee2MQTT)
description: |
  Home Assistant for automations, Mosquitto as the MQTT broker, and
  Zigbee2MQTT (opt-in via 'zigbee' profile) to bridge a Zigbee USB
  coordinator (CC2531, Sonoff ZBDongle-P/E, etc.) onto MQTT.

  Home Assistant runs with network_mode: host — this is standard
  practice and required for many local-discovery integrations (mDNS,
  SSDP, HomeKit, Chromecast). It is therefore NOT attached to home_net.

category: home-automation

depends_on:
  - core
recommends: []

profiles:
  zigbee:
    description: Enable Zigbee2MQTT (requires a Zigbee USB coordinator).
    requires_packages: []

ports:
  - {port: 8123, proto: tcp, description: Home Assistant UI (host network)}
  - {port: 1883, proto: tcp, description: Mosquitto MQTT}
  - {port: 8883, proto: tcp, description: Mosquitto MQTT-TLS}
  - {port: 8084, proto: tcp, description: Zigbee2MQTT web UI, profile: zigbee}

requires:
  min_ram_mb: 1024
  min_disk_gb: 4
  host_roles: []

required_env:
  - TZ

post_install_notes: |
  1. Home Assistant onboarding wizard: http://<lan-ip>:8123
  2. MQTT broker has no default credentials; create them with:
       docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
     then edit packages/home-automation/mosquitto/config/mosquitto.conf
     to set `allow_anonymous false` and `password_file /mosquitto/config/passwd`.
  3. For Zigbee: plug in the USB coordinator, set ZIGBEE_ADAPTER in
     .env (e.g. /dev/serial/by-id/usb-...), then bring the stack up
     with the 'zigbee' profile (see scripts/up.sh --zigbee).
