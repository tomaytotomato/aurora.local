name: aurora-automation
title: Home automation (Home Assistant + MQTT + Zigbee2MQTT)
description: |
  Runs the lights, heating, sensors and switches in your home, locally. Keeps
  working when the internet is down, and does not report to a manufacturer.
  Zigbee devices need a USB stick, which you can add later.
category: home-automation
icon: home-assistant

depends_on:
  - core
recommends: []

profiles:
  zigbee:
    description: Enable Zigbee2MQTT (requires a Zigbee USB coordinator).
    requires_packages: []

ports:
  - {port: 8123, proto: tcp, description: Home Assistant UI (host network)}
  - {port: 1883, proto: tcp, description: Mosquitto MQTT}
  - {port: 8883, proto: tcp, description: Mosquitto MQTT-TLS}
  - {port: 8084, proto: tcp, description: Zigbee2MQTT web UI, profile: zigbee}

requires:
  min_ram_mb: 1024
  min_disk_gb: 4
  host_roles: []
  # A8 (iter-7): home-assistant + zigbee2mqtt + mosquitto + friends.
  # Home Assistant init pass eats ~30s alone; 90s is a comfortable
  # warm-relaunch budget.
  start_budget_seconds: 90

required_env:
  - TZ

warnings:
  - id: automation_low_ram
    if: { ram_below_mb: 1024 }
    message: 'Home Assistant + Mosquitto (and Zigbee2MQTT under the zigbee profile) want at least 1 GB RAM headroom. Below that, automations get sluggish.'

# ---- SSO (Phase D) -------------------------------------------------
# Home Assistant has a first-class auth system + trusted_networks
# option; the trusted-header path is fiddly and easy to misconfigure.
# For v1 we edge-gate ha.{DOMAIN} with Authelia and let HA's own auth
# handle the inner session. Zigbee2MQTT (z2m.{DOMAIN}) has no auth
# at all, so Authelia is the only wall in front of it — min_role:
# user is the right floor for a household member.
sso:
  protect: true
  min_role: user
  trusted_headers: false

post_install_notes: |
  1. Home Assistant onboarding wizard: http://<lan-ip>:8123
  2. MQTT broker has no default credentials; create them with:
       docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
     then edit packages/home-automation/mosquitto/config/mosquitto.conf
     to set `allow_anonymous false` and `password_file /mosquitto/config/passwd`.
  3. For Zigbee: plug in the USB coordinator, set ZIGBEE_ADAPTER in
     .env (e.g. /dev/serial/by-id/usb-...), then bring the stack up
     with the 'zigbee' profile (see scripts/up.sh --zigbee).

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/home-assistant/core
homepage_url: https://www.home-assistant.io
