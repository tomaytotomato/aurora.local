name: notes
title: Notes (SilverBullet)
description: |
  SilverBullet is a single-user, markdown-native, extensible
  notes/PKM system with a live command palette, a plug ecosystem,
  and an offline-capable PWA. Everything is a plain .md file on
  disk, so your notes survive the tool.

category: productivity

depends_on:
  - core
recommends: []

# The default note-taking variant. Memos is the lighter alternative;
# the picker offers the `notes` group as one choice.
variant_group: notes
variant_default: true

profiles: {}

ports:
  # SilverBullet's default upstream port is 3000, which collides
  # with AdGuard's first-run wizard in packages/privacy. Remap.
  - {port: 3030, proto: tcp, description: SilverBullet web UI}

requires:
  min_ram_mb: 256
  min_disk_gb: 1
  host_roles: []

required_env:
  - SB_USER
  - SB_PASSWORD

# The compose service is named `silverbullet` (see compose.yml), not
# `notes`. Without an explicit probe.container, StatusProbeService
# defaults to the package name and never finds the running container,
# so the DoneChecklist reports Not-started while PackagesCard
# (label-scan-based) correctly reports Running. Manifest → wire fix.
probe:
  kind: docker
  container: silverbullet
  external_url: "http://notes.{domain}/"

# ---- SSO (Phase D) -------------------------------------------------
# SilverBullet keeps its own single-user SB_USER / SB_PASSWORD but
# Authelia gates the notes.{DOMAIN} vhost at the edge — after SSO
# lands nobody sees SilverBullet's login page unauthenticated.
# trusted_headers=false because SilverBullet doesn't read Remote-User;
# the SB_USER just prevents a random LAN device that somehow got past
# Caddy from talking to :3000 directly.
sso:
  protect: true
  min_role: user
  trusted_headers: false
  # SilverBullet has no trusted-header auth mode — setting SB_USER
  # would show a second login page after Authelia already granted
  # access. Blanking SB_USER + SB_PASSWORD makes SilverBullet run
  # auth-less internally; Authelia forward-auth is the only wall.
  # Aurora writes empty values into packages/notes/.env when SSO is
  # enabled via the wizard (D10) or /api/onboarding/sso.
  disable_env: [SB_USER, SB_PASSWORD]

post_install_notes: |
  ## SSO enabled (recommended)

  If Aurora manages Authelia SSO (see the onboarding "Single sign-on"
  step, or POST /api/onboarding/sso), SB_USER + SB_PASSWORD in
  packages/notes/.env are automatically blanked. SilverBullet then
  runs auth-less internally — Authelia forward-auth at Caddy is the
  only wall.

  1. Sign into Aurora at https://$DOMAIN/
  2. Click Notes on the dashboard — no second login page.
  3. Notes live as .md files under ../../data/notes/silverbullet
     (or wherever you point the bind mount).
  4. There is no first-class mobile app; the PWA installs to
     iOS/Android home screens and works offline.

  ## SSO disabled (standalone)

  1. Set SB_USER + SB_PASSWORD in packages/notes/.env.
  2. First-run: https://notes.$DOMAIN/ — log in with those creds.
  3. Storage as above.

# Upstream project. Rendered as the Source and Docs buttons on the
# app page; the package's headline service, not every image it runs.
source_url: https://github.com/silverbulletmd/silverbullet
homepage_url: https://silverbullet.md
