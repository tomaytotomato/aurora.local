name: ci
on:
  push:
    branches: [main, productionize, "wt/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(bootstrap.sh scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh)
          shellcheck -x -S style -e SC1091 "${files[@]}"
      - name: shell unit tests
        run: ./scripts/tests/net.test.sh

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yamllint
        run: pipx install yamllint || pip install --user yamllint
      - name: config
        run: |
          cat > .yamllint <<'YL'
          extends: default
          rules:
            line-length: {max: 160, allow-non-breakable-words: true, allow-non-breakable-inline-mappings: true}
            comments: {min-spaces-from-content: 1}
            comments-indentation: disable
            commas: disable
            document-start: disable
            truthy: {check-keys: false}
            braces: disable
            indentation: {spaces: consistent, indent-sequences: consistent}
          YL
      - name: lint
        run: |
          yamllint packages/*/manifest.yml host/ group_vars/ .github/workflows/

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: install ansible-lint
        run: pip install --user "ansible-lint>=6.22" ansible-core
      - name: lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-lint host/site.yml || true   # advisory for now

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - "core"
          - "core privacy"
          - "core media"
          - "core storage"
          - "core roundcube"
          - "core snappymail"
          - "core privacy media"
          - "core privacy media storage"
    steps:
      - uses: actions/checkout@v4
      - name: seed .env files
        run: |
          for p in packages/*/; do
            if [ -f "$p/.env.example" ] && [ ! -f "$p/.env" ]; then
              cp "$p/.env.example" "$p/.env"
            fi
          done
      - name: compose config
        run: |
          set -euo pipefail
          args=()
          for p in ${{ matrix.combo }}; do
            args+=(-f "packages/$p/compose.yml")
          done
          # aurora_net is external in every stack; declare it locally for validation
          export COMPOSE_PROJECT_NAME=ci
          # `docker compose config` fails on missing external networks with
          # some versions; --resolve-image-digests is off by default.
          docker compose "${args[@]}" config -q \
            || docker compose "${args[@]}" --profile torrent config -q

  openapi-spec:
    name: openapi spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: install validator
        run: pip install --user "pyyaml>=6"
      - name: check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/check-openapi.py

  core-isolation:
    name: core isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no non-core package may reference core-internal services
        run: |
          # docs/PACKAGE_CONTRACT.md: core is a shared stack; non-core
          # packages are isolated and MUST NOT connect to core-db /
          # core-cache (or any other package's services). Only
          # packages/core/ may define or reference them. This keeps a
          # non-core app's blast radius sealed off from auth + mail.
          bad=0
          for f in packages/*/compose.yml; do
            case "$f" in
              packages/core/*) continue ;;
            esac
            hits=$(grep -nE 'core-db|core-cache' "$f" || true)
            if [ -n "$hits" ]; then
              bad=1
              msg="non-core package references a core-internal service (core-db/core-cache)."
              msg="$msg Non-core packages own their own datastore — see docs/PACKAGE_CONTRACT.md."
              echo "::error file=$f::$msg"
              echo "$hits"
            fi
          done
          exit $bad

  manifest-schema:
    name: manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: install validator
        run: pip install --user "jsonschema>=4" "pyyaml>=6"
      - name: validate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python - <<'PY'
          import json, sys, glob, pathlib
          import yaml
          from jsonschema import Draft7Validator
          schema = json.loads(pathlib.Path(".github/schema/manifest.schema.json").read_text())
          v = Draft7Validator(schema)
          bad = 0
          for f in sorted(glob.glob("packages/*/manifest.yml")):
              # Skip the template
              if "/_template/" in f: continue
              data = yaml.safe_load(pathlib.Path(f).read_text())
              errs = sorted(v.iter_errors(data), key=lambda e: e.path)
              if errs:
                  bad += 1
                  print(f"::error file={f}::manifest schema errors:")
                  for e in errs:
                      path = "/".join(str(p) for p in e.path) or "(root)"
                      print(f"  {path}: {e.message}")
              else:
                  print(f"OK {f}")
          sys.exit(1 if bad else 0)
          PY

  # Neither of the two test suites had a CI job until now: 441 backend
  # tests and 436 frontend tests only ever ran on a developer's machine,
  # so nothing stopped a regression landing on main.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/dashboard/frontend/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm run test:unit
      - name: build
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: test
        run: ./mvnw --batch-mode test

  # The container-backed tests, kept in their own job so the fast suite
  # above stays fast. These exist to check assumptions about real
  # dependencies rather than our own logic, so a failure here means
  # something we believed about docker or a registry is wrong.
  backend-contract:
    name: backend contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: contract tests
        run: ./mvnw --batch-mode test -Dgroups=registry -DexcludedGroups=

  # Build the dashboard image and publish it to GHCR. Gated on both test
  # suites so a red build never ships an image, and scoped to main and
  # release tags so pull requests (including from forks, which have no
  # packages:write) never try to push. Multi-arch: the Dockerfile already
  # handles TARGETARCH, and the target hardware is unknown (an amd64
  # Optiplex today, an arm64 board tomorrow), so both are built.
  #
  # Image name is ghcr.io/<owner>/aurora — the name the codebase already
  # anticipates (see UnpinnedImageTagsRule's javadoc), not the local
  # build tag aurora-dashboard.
  publish-image:
    name: publish image (ghcr)
    needs: [frontend, backend]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: set up qemu (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aurora
          # main → edge + sha-<short>; a vX.Y.Z tag → X.Y.Z, X.Y, latest.
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/dashboard
          file: packages/dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A single-manifest image per arch, no attestation manifest — keeps
          # the GHCR package listing from showing an "unknown/unknown" entry.
          provenance: false
