[defaults]
inventory = ./inventory.ini
roles_path = ./host/roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# The install transcript is something a non-technical owner watches go by.
# ansible-core's INJECT_FACTS_AS_VARS notice printed a five-line block with a
# source excerpt and a caret diagram for every use, which crowded out the
# lines that actually matter. The roles use ansible_facts['...'] now, so
# there is nothing left to warn about here either.
deprecation_warnings = False
