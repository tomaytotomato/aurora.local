---
# Copy to group_vars/all.yml and edit. This file is checked in as a
# template; the real all.yml is gitignored so machine-specific values
# don't leak.

# ---- identity ----
domain: aurora.local            # Caddy vhosts hang under this
home_timezone: Europe/London
home_user: bruce
home_uid: 1000
home_gid: 1000

# ---- storage layout ----
# Where the repo lives on disk. bind-mounts in packages/*/compose.yml
# resolve relative to this via ${HOME_LOCAL_ROOT}.
home_local_root: /home/{{ home_user }}/aurora.local

# Where bulk media lives. Kept outside the repo so a fresh clone
# doesn't imply moving TBs around.
media_root: /home/{{ home_user }}/media

# External disks to mount on boot. Consumed by the storage-mount role.
# Leave empty to skip. Prefer UUID over LABEL for stability.
#   external_mounts:
#     - uuid: "1234-abcd-5678-ef00"
#       mountpoint: /mnt/media
#       fstype: ext4
#       options: "defaults,nofail,x-systemd.device-timeout=10"
#     - label: BACKUP
#       mountpoint: /mnt/backup
#       fstype: xfs
external_mounts: []

# ---- disk pooling + parity (opt-in) ----
# mergerfs unions several already-mounted data disks into one pool at
# storage_pool_mountpoint. SnapRAID adds parity so a failed data disk
# can be rebuilt. smartd watches disk health (on by default; harmless
# where there is no SMART). None of these format or partition anything —
# the disks must already be formatted and mounted (see external_mounts).
#
# mergerfs_enabled: true
# mergerfs_mountpoint: /mnt/storage
# mergerfs_branches:
#   - /mnt/disk1
#   - /mnt/disk2
#
# snapraid_enabled: true
# snapraid_data_disks:
#   - {name: d1, path: /mnt/disk1}
#   - {name: d2, path: /mnt/disk2}
# snapraid_parity_files:
#   - /mnt/parity1/snapraid.parity      # dedicated disk, >= largest data disk
#
# smartd_enabled: true                  # default; set false to disable
# smartd_notify_email: ""               # needs a working local MTA if set

# ---- package toggles ----
# Consumed by scripts/up.sh; ansible only cares about host-level roles.
packages_enabled:
  - core        # always on: caddy + Aurora dashboard
  - privacy     # adguard + gluetun
  - media       # arr stack + rdtclient + qbittorrent
  - storage     # samba + minidlna

# ---- swap ----
# 'auto' picks max(2, RAM_GB) capped at swap_file_auto_max_gb.
# Set an integer (GB) to force a specific size.
swap_file_path: /swapfile
swap_file_size_gb: auto
swap_min_ram_gb_threshold: 4       # only create swap if RAM < this
swap_file_auto_max_gb: 8

# ---- unattended-upgrades ----
unattended_upgrades_reboot: false
unattended_upgrades_reboot_time: "03:00"
unattended_upgrades_mail: ""       # e.g. "you@example.com" (needs local MTA)

# ---- security ----
ssh_allow_password_auth: false
ssh_permit_root_login: "no"
firewall_allow_from_lan_only: true
firewall_lan_cidr: 192.168.0.0/24
fail2ban_ban_time: 1h
fail2ban_find_time: 10m
fail2ban_max_retry: 5

# ---- network ----
# AdGuard runs as LAN DNS. Set this to the address of the box on your
# LAN so *.{{ domain }} rewrites resolve to it.
lan_ip: 192.168.0.110

# mDNS host name published by avahi (usually leave as inventory_hostname).
# avahi_host_name: aurora

# Debian's systemd-resolved listens on 127.0.0.53:53, which stops
# AdGuard binding port 53 and so stops the privacy package starting at
# all. The dns-stub role turns that stub listener off and repoints
# /etc/resolv.conf at the upstream servers resolved already knows.
# Set false to keep the loopback stub; the privacy package will then
# only start if LAN_IP in packages/privacy/.env names a specific address.
dns_stub_listener_disabled: true
